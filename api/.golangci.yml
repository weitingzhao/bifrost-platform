# golangci-lint v2 config for bifrost-platform API
# https://golangci-lint.run/docs/configuration/file/
# Note: gosimple is merged into staticcheck in v2.

version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck # includes gosimple checks
    - unused
  settings:
    govet:
      disable:
        - fieldalignment
      enable-all: true
  exclusions:
    generated: lax
    rules:
      # A store test with an event clock of its own starts with
      # ctx := ownClock(t), and a helper with ctx := ctxOf(t): hiding the
      # package-level ctx of the test files is what the line is for.
      - path: internal/agentrt/store/.*_test\.go
        linters: [govet]
        text: 'shadow: declaration of "ctx" shadows declaration at line'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
