# The communication layer's channels and where each goes (the next
# generation's disposition table, 2026-11-16, 153 rows; source: shared notes
# brain/comm-nextgen-disposition-2026-11-16.md, design v1.2).
#
# disposition: replaced (a new piece takes it over), merged (kept and
# reworked; what merges into it is "replaced"), kept, announced (stays where
# it is and says its changes on the bus), deleted (a dead road),
# not-this-way, reserved.
#
# What is left at the end (the table's section 2.4): 70 rows go (replaced 58 +
# deleted 12); 83 stay where they are (kept 31, merged 20, announced 27,
# not-this-way and reserved 5); with the 13 new pieces that is 96, about 85
# once the same thing listed twice is counted once. The design's 64 counts only
# kept + merged + new pieces. The page computes these from this table.
#
# step: the switch step that moves the channel's traffic (the table's "step"
# column): 0 to 5, any (a dead road, deleted at any time), none (no switch).
#
# cut: the traffic has moved to the new path, the old one may still stand. It
# names what proves it runs (evidence): reader:<id>, a mark the code leaves on
# each answer from the new source (bus/readerseen), or topic:<type>, the relay
# publishing that event. The page reads them from this environment's metrics;
# without a recent run a cut does not count as proven.
#
# retired: the old channel is gone. It names when and in which change, and
# what proves it (absent: paths that must not exist; absent_text: text that
# must appear in no Go file of the module). TestRetiredChannelsAreGone checks
# the proof against the code, so this file cannot say a channel is gone while
# it is still there. A channel outside this repository says so (outside) and
# is not checked here.
