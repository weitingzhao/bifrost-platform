# Every channel that sends an alert, a failure, an anomaly, a call for help or
# work waiting for a person (the Owner, 2026-11-18: first make problems visible).
# state: connected (an event on the bus, seen in one place, with a receiver),
# todo (plan: connect, the default, or delete), deleted (done: no longer used to
# report problems) or pending (being decided).
# events: what proves it runs here: topic:<type> (the relay published it), or, when
# a topic is shared, alert:<name>, stream:<id> or source:<type>:<source>.
# drill: the evidence key of a channel whose event never comes in normal life
# (bus/drill writes one controlled event a day to drill:<id>); it counts apart
# from a real run, and a real run wins. events never name a drill stream.
# id is a row of channels.yaml, or Y-n for a channel that table does not have.
