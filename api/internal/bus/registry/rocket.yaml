      guarantee: best-effort
      subject: "<service>"
      publisher: gate-db
      domain: compute
      ref: "/api/v1/dev-sessions"
      reconcile: "bdev sessions.yaml (dev only, not on the bus)"
      on_unread: stale
      retention: 30d
      consumers: [console]
      exports: []
      replaces: [C03]
  reconcile.drift.found:
