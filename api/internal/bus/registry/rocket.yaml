asyncapi: 3.0.0
info:
  title: Bifrost rocket tenant event registry
  version: '1'
  description: >-
    The closed list of event types of the rocket tenant (the platform itself).
    Rules: agent-config (step0 spec) §1-§5. Generated from one table; edit here, CI validates.
x-bifrost-tenant: rocket
channels:
  git.main.advanced:
    address: ev.rocket.{env}.git.main.advanced
    x-bifrost:
      version: 1
      lane: event
      guarantee: ordered
      key: repo
      subject: "<repo>@<sha40>"
      publisher: gate-git
      domain: lineage
      ref: "/api/v1/delivery/context?repo={repo}"
      reconcile: "gate-git compares Gitea branches/main every 5 min"
      on_unread: stale
      retention: 30d
      consumers: [headrelease, console, unit-watch]
      exports: []
      replaces: [L04, L06, X-A28]
  git.mirror.settled:
    address: ev.rocket.{env}.git.mirror.settled
    x-bifrost:
      version: 1
      lane: event
      guarantee: best-effort
      subject: "<repo>@<sha40>"
      publisher: gate-cluster
      domain: lineage
      ref: "/api/v1/delivery/context?repo={repo}"
      reconcile: "mirror sync TaskRuns listed by gate-cluster"
      on_unread: stale
      retention: 30d
      # For watching: nothing acts on it yet.
      display_only: true
      consumers: [console]
      exports: []
      replaces: [X-A13]
  ci.run.started:
    address: ev.rocket.{env}.ci.run.started
    x-bifrost:
      version: 1
      lane: event
      guarantee: best-effort
      subject: "<pipelinerun>@<sha40>"
      publisher: gate-cluster
      domain: verification
      ref: "/api/v1/delivery/runs/{run}"
      reconcile: "gate-cluster relist of PipelineRuns"
      on_unread: stale
      # Display only (2026-11-17): the run's start is for watching; what
      # follows a run is ci.run.finished. Not counted in heard.
      retention: 30d
      # For watching: nothing acts on it yet.
      display_only: true
      consumers: [console]
      exports: []
      replaces: [L02]
      console_keys: [[delivery, runs], [delivery, pipelines], [ci]]
  ci.run.finished:
    address: ev.rocket.{env}.ci.run.finished
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      subject: "<pipelinerun>@<sha40>"
      publisher: gate-cluster
      domain: verification
      ref: "/api/v1/delivery/runs/{run}"
      reconcile: "gate-cluster relist of PipelineRuns"
      on_unread: stale
      retention: 30d
      consumers: [headrelease, console, release-recorder]
      exports: []
      replaces: [L02, L28, N21, W04, C01, X-A15, X-B16]
      console_keys: [[delivery, runs], [delivery, pipelines], [ci]]
  ci.verdict.changed:
    address: ev.rocket.{env}.ci.verdict.changed
    x-bifrost:
      version: 1
      lane: event
      guarantee: ordered
      key: tree
      subject: "<tree>@<sha40>:<kind>[/<scope>]"
      publisher: gate-db
      domain: verification
      ref: "/api/v1/units/plan?repo={repo}&commit={sha}"
      reconcile: "evidence ledger is the truth; readers re-read R05"
      on_unread: closed
      retention: 30d
      consumers: [console]
      exports: []
      replaces: [L03, X-A3, X-A5, X-A6, X-A7]
      console_keys: [[delivery, runs], [delivery, pipelines], [ci]]
  release.deploy.finished:
    address: ev.rocket.{env}.release.deploy.finished
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      subject: "<env>/<app>@<sha40>"
      publisher: gate-db
      domain: delivery
      ref: "/api/v1/delivery/context?repo={repo}"
      reconcile: "release records (releases package) recorder tick"
      on_unread: stale
      retention: 30d
      consumers: [console]
      exports: []
      replaces: [L05, L09, S08, C02]
      console_keys: [[releases], [gitops]]
  release.gitops.changed:
    address: ev.rocket.{env}.release.gitops.changed
    x-bifrost:
      version: 1
      lane: event
      guarantee: best-effort
      subject: "<argo-app>"
      publisher: gate-cluster
      domain: delivery
      ref: "/api/v1/gitops/apps"
      reconcile: "Argo Application list"
      on_unread: stale
      retention: 30d
      # For watching: nothing acts on it yet.
      display_only: true
      consumers: [console]
      exports: []
      replaces: [L28]
      console_keys: [[releases], [gitops]]
  release.window.changed:
    address: ev.rocket.{env}.release.window.changed
    x-bifrost:
      version: 1
      lane: event
      guarantee: ordered
      key: window
      subject: "window"
      publisher: gate-cluster
      domain: delivery
      ref: "/api/v1/delivery/release-window"
      reconcile: "window ConfigMap is the truth"
      on_unread: closed
      retention: 30d
      consumers: [headrelease, console, window-queue]
      exports: []
      replaces: [L24, N11, X-A9, X-C2, X-C10]
      console_keys: [[delivery, release-window], [ci, release-window]]
  release.policy.expiring:
    address: ev.rocket.{env}.release.policy.expiring
    x-bifrost:
      version: 1
      lane: event
      guarantee: best-effort
      subject: "<policy-id>"
      publisher: gate-db
      domain: delivery
      ref: "/api/v1/release-policy"
      reconcile: "policy reader on each check"
      on_unread: stale
      retention: 30d
      # For watching: the phone is told directly, by the code that decides.
      display_only: true
      consumers: [console]
      exports: []
      replaces: [L17, N04]
  approval.card.created:
    address: ev.rocket.{env}.approval.card.created
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      subject: "#<number>"
      publisher: gate-db
      domain: approvals
      ref: "/api/v1/approvals/{id}"
      reconcile: "approval store is the truth"
      on_unread: stale
      retention: 30d
      consumers: [console, card-created-notice]
      exports: []
      replaces: [L01, C01]
      console_keys: [[approvals], [cockpit], [agent-runtime-progress]]
  approval.card.decided:
    address: ev.rocket.{env}.approval.card.decided
    x-bifrost:
      version: 1
      lane: event
      guarantee: ordered
      key: card
      subject: "#<number>"
      publisher: gate-db
      domain: approvals
      ref: "/api/v1/approvals/{id}"
      reconcile: "approval store is the truth"
      on_unread: closed
      retention: 30d
      consumers: [console, card-conclusions]
      exports: []
      replaces: [L01, N10, W02, X-A14, X-B16]
      console_keys: [[approvals], [cockpit], [agent-runtime-progress]]
  approval.card.executed:
    address: ev.rocket.{env}.approval.card.executed
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      subject: "#<number>"
      publisher: gate-db
      domain: approvals
      ref: "/api/v1/approvals/{id}"
      reconcile: "approval store is the truth"
      on_unread: stale
      retention: 30d
      consumers: [console, card-conclusions]
      exports: []
      replaces: [L28, W02]
      console_keys: [[approvals], [cockpit], [agent-runtime-progress]]
  approval.card.notified:
    address: ev.rocket.{env}.approval.card.notified
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      subject: "#<number>"
      publisher: gate-db
      domain: approvals
      ref: "/api/v1/approvals/{id}"
      reconcile: "approval store is the truth"
      on_unread: stale
      retention: 30d
      consumers: [console]
      exports: []
      replaces: []
      console_keys: [[approvals], [cockpit], [agent-runtime-progress]]
  owner.question.asked:
    address: ev.rocket.{env}.owner.question.asked
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      subject: "<question-id>"
      publisher: gate-db
      domain: approvals
      ref: "/api/v1/questions/{id}"
      reconcile: "question store is the truth"
      on_unread: stale
      retention: 30d
      # For watching: the phone is told directly, by the code that decides.
      display_only: true
      consumers: [console]
      exports: []
      replaces: [L01, N02]
      console_keys: [[questions]]
  owner.question.answered:
    address: ev.rocket.{env}.owner.question.answered
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      subject: "<question-id>"
      publisher: gate-db
      domain: approvals
      ref: "/api/v1/questions/{id}"
      reconcile: "question store is the truth"
      on_unread: stale
      retention: 30d
      consumers: [console, question-conclusions]
      exports: []
      replaces: [L01, N10, W03, X-B16]
      console_keys: [[questions]]
  seat.mail.arrived:
    address: ev.rocket.{env}.seat.mail.arrived
    x-bifrost:
      version: 1
      lane: event
      guarantee: ordered
      key: seat
      subject: "<seat>"
      publisher: gate-db
      domain: coordination
      ref: "/api/v1/agentrt/messages?to={seat}"
      reconcile: "none: the inbox is the truth (self-declared)"
      on_unread: stale
      retention: 30d
      # The letter is delivered when it is written; this only wakes a seat that
      # happens to be waiting, so most have no listener and that is no gap.
      display_only: true
      consumers: [console, inbox-waiters]
      exports: []
      replaces: [N11, W01, X-B16, X-C2, X-C10, X-C12, X-C14]
  seat.status.changed:
    address: ev.rocket.{env}.seat.status.changed
    x-bifrost:
      version: 2
      lane: event
      guarantee: ordered
      key: seat
      subject: "<seat>"
      publisher: gate-db
      domain: coordination
      ref: "/api/v1/agentrt/seats"
      reconcile: "none: the seat record is the truth (self-declared)"
      on_unread: stale
      retention: 30d
      # For watching: the seat record is read from its route.
      display_only: true
      consumers: [console]
      exports: []
      replaces: [L19, L21, N14, N16, S10, C01, X-B1, X-B2, X-B6, X-C1, X-C5, X-C6, X-C17]
      console_keys: [[agent-threads], [seat-statuses]]
  seat.liveness.changed:
    address: ev.rocket.{env}.seat.liveness.changed
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      subject: "<seat-or-host>"
      publisher: gate-db
      domain: coordination
      ref: "/api/v1/seats/{seat}"
      reconcile: "liveness judge rescans last_seen every 30 s"
      on_unread: stale
      retention: 30d
      # For watching: the phone is told directly, by the code that decides.
      display_only: true
      consumers: [console]
      exports: []
      replaces: [L18, N03, N14]
      console_keys: [[agent-threads], [seat-statuses]]
  seat.session.changed:
    address: ev.rocket.{env}.seat.session.changed
    x-bifrost:
      version: 2
      lane: event
      guarantee: best-effort
      subject: "<seat>/<session>"
      publisher: gate-db
      domain: coordination
      ref: "/api/v1/agentrt/seats"
      reconcile: "seat record bindings"
      on_unread: stale
      retention: 30d
      # For watching: the seat record is read from its route.
      display_only: true
      consumers: [console]
      exports: []
      replaces: [X-B3]
      console_keys: [[agent-threads], [seat-statuses]]
  alert.rule.fired:
    address: ev.rocket.{env}.alert.rule.fired
    x-bifrost:
      # v2 (2026-11-20): an alert about one machine carries host and ends its
      # subject with /<host>; match=@<namespace> still matches it.
      version: 2
      lane: event
      guarantee: durable
      subject: "<alertname>@<namespace>[/<host>]"
      publisher: gate-db
      domain: compute
      ref: "/api/v1/telemetry/alerts"
      reconcile: "Alertmanager re-sends while firing"
      on_unread: stale
      retention: 30d
      consumers: [console, alert-letters]
      exports: []
      replaces: []
      console_keys: [[telemetry, alerts]]
  loop.health.changed:
    address: ev.rocket.{env}.loop.health.changed
    x-bifrost:
      version: 1
      lane: event
      guarantee: best-effort
      subject: "<loop>"
      publisher: gate-db
      domain: foundation
      ref: "/api/v1/agentrt/progress"
      reconcile: "loop registry heartbeat"
      on_unread: stale
      retention: 30d
      # For watching: nothing acts on it yet.
      display_only: true
      consumers: [console]
      exports: []
      replaces: []
  env.health.changed:
    address: ev.rocket.{env}.env.health.changed
    x-bifrost:
      version: 2
      lane: event
      guarantee: best-effort
      subject: "<env>/<service>"
      publisher: gate-db
      domain: compute
      ref: "/api/v1/checklist/signals"
      reconcile: "checklist prober, every 10 minutes"
      on_unread: stale
      retention: 30d
      consumers: [console]
      exports: []
      replaces: [R12, C01]
  cluster.node.changed:
    address: ev.rocket.{env}.cluster.node.changed
    x-bifrost:
      version: 1
      lane: event
      guarantee: best-effort
      subject: "<node>"
      publisher: gate-cluster
      domain: compute
      ref: "/api/v1/cluster/nodes"
      reconcile: "gate-cluster relists the nodes every 30 min"
      on_unread: stale
      retention: 30d
      # A node turned ready or not ready, or was cordoned or uncordoned
      # (2026-11-20: ubt-k3s-05 was drained and the bus's NATS on it sat
      # Pending an hour while nothing said so). Written by the watch row
      # "nodes" (watches/rocket.yaml); its body is declared from here.
      consumers: [console]
      exports: []
      replaces: []
      body:
        - {name: node, kind: str, pattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'}
        - {name: ready, kind: str, pattern: '^(ready|notready|unknown|gone)$'}  # gone: left the cluster (2026-11-21, registry.Gone)
        - {name: schedule, kind: str, pattern: '^(schedulable|cordoned|gone)$'}
        - {name: subject, kind: str}
        - {name: ref, kind: str}
        - {name: change, kind: str}
      subject_from: node
      change_from: [ready, schedule]
      console_keys: [[cluster, nodes], [cluster, governance]]
  cluster.workload.changed:
    address: ev.rocket.{env}.cluster.workload.changed
    x-bifrost:
      version: 1
      lane: event
      guarantee: best-effort
      subject: "<namespace>/<name>"
      publisher: gate-cluster
      domain: compute
      ref: "/api/v1/cluster/workloads"
      reconcile: "gate-cluster relists every 30 min"
      on_unread: stale
      retention: 30d
      # A Deployment or StatefulSet came up (ready replicas equal replicas) or
      # went down (2026-11-20: NATS sat Pending an hour and nothing on the bus
      # said so). Written by the watch rows "deployments", "statefulsets" and
      # (2026-11-21) "daemonsets"
      # (watches/rocket.yaml); its body is declared from here. Every namespace:
      # the Owner asked that every module's state reach the bus.
      consumers: [console]
      exports: []
      replaces: []
      body:
        - {name: workload, kind: str, pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?/[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$'}
        - {name: ready, kind: str, pattern: '^(ready|notready|gone)$'}  # gone: left the cluster (2026-11-21, registry.Gone)
        - {name: subject, kind: str}
        - {name: ref, kind: str}
        - {name: change, kind: str}
      subject_from: workload
      change_from: [ready]
      console_keys: [[cluster, workloads]]
  cluster.database.changed:
    address: ev.rocket.{env}.cluster.database.changed
    x-bifrost:
      version: 2
      lane: event
      guarantee: best-effort
      subject: "<namespace>/<name>"
      publisher: gate-cluster
      domain: compute
      ref: "/api/v1/cluster/postgres"
      reconcile: "gate-cluster relists every 30 min"
      on_unread: stale
      retention: 30d
      # A CloudNativePG cluster lost or regained a ready instance, or its
      # primary moved (a failover or switchover). Written by the watch row
      # "postgres" (watches/rocket.yaml); no Go. Origin: 2026-11-20 the
      # Owner asked that the database's state reach the bus like every
      # module's; until now only a backup's age was read, on a poll.
      consumers: [console]
      exports: []
      replaces: []
      body:
        - {name: database, kind: str, pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?/[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$'}
        - {name: ready, kind: str, pattern: '^(ready|notready|gone)$'}  # gone: left the cluster (2026-11-21, registry.Gone)
        - {name: primary, kind: str, pattern: '^([a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?)?$'}
        # v2 (2026-11-21): the backups, from the cluster's own status.
        - {name: backup, kind: str, pattern: '^(ok|failed|unknown|gone)$'}
        - {name: archiving, kind: str, pattern: '^(ok|failed|unknown|gone)$'}
        - {name: last_backup, kind: str, pattern: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z|gone)?$'}
        - {name: subject, kind: str}
        - {name: ref, kind: str}
        - {name: change, kind: str}
      subject_from: database
      change_from: [ready, primary, backup, archiving, last_backup]
      console_keys: [[cluster, postgres]]
  plugin.status.changed:
    address: ev.rocket.{env}.plugin.status.changed
    x-bifrost:
      version: 2
      lane: event
      guarantee: best-effort
      subject: "<plugin>"
      publisher: gate-db
      domain: payload
      ref: "/api/v1/plugins/<plugin>/status"
      reconcile: "checklist prober, every 10 minutes"
      on_unread: stale
      retention: 30d
      consumers: [console]
      exports: []
      replaces: [C01]
  schema.migration.applied:
    address: ev.rocket.{env}.schema.migration.applied
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      subject: "<db>:<migration>"
      publisher: gate-db
      domain: foundation
      ref: "/health"
      reconcile: "schema_migrations table"
      on_unread: closed
      retention: 30d
      # For watching: the schema watch reads the database itself.
      display_only: true
      consumers: [console]
      exports: []
      replaces: [L28]
  data.job.finished:
    address: ev.rocket.{env}.data.job.finished
    x-bifrost:
      version: 1
      lane: event
      guarantee: best-effort
      subject: "<job>"
      publisher: gate-cluster
      domain: payload
      ref: "/api/v1/data/clone"
      reconcile: "Job list"
      on_unread: stale
      retention: 30d
      # For watching: nothing acts on it yet.
      display_only: true
      consumers: [console]
      exports: []
      replaces: []
  audit.action.recorded:
    address: ev.rocket.{env}.audit.action.recorded
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      subject: "<actor>:<action>"
      publisher: gate-db
      domain: foundation
      ref: "/api/v1/audit"
      reconcile: "audit store"
      on_unread: stale
      retention: 30d
      # Published to be watched on the Bus page: who did what, as it happens.
      display_only: true
      consumers: [console]
      exports: []
      replaces: [S02]
      console_keys: [[records], [audit]]
      # Recorded actions come in bursts; 60 s keeps their refresh at or under the old 60 s poll (11-19).
      console_settle_ms: 60000
  reconcile.drift.found:
    address: ev.rocket.{env}.reconcile.drift.found
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      subject: "<object>"
      publisher: gate-db
      domain: foundation
      ref: "/api/v1/bus/events"
      reconcile: "none: it is itself the reconciliation report"
      on_unread: stale
      retention: 30d
      consumers: [console]
      exports: []
      replaces: []
  # Known regressions on main (2026-11-17, the coordinator: information, no
  # gate). Keyed <repo>@<introduced>; known and fixed pair on the key.
  main.regression.known:
    address: ev.rocket.{env}.main.regression.known
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      key: "<repo>@<introduced40>"
      subject: "<repo>@<introduced40>"
      publisher: gate-db
      domain: verification
      ref: "/api/v1/bus/regressions?repo={repo}"
      reconcile: "the ledger is the truth; GET /api/v1/bus/regressions lists what is open"
      on_unread: stale
      retention: 30d
      consumers: [console]
      exports: []
      replaces: []
  main.regression.fixed:
    address: ev.rocket.{env}.main.regression.fixed
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      key: "<repo>@<introduced40>"
      subject: "<repo>@<introduced40>"
      publisher: gate-db
      domain: verification
      ref: "/api/v1/bus/regressions?repo={repo}"
      reconcile: "the ledger is the truth; GET /api/v1/bus/regressions lists what is open"
      on_unread: stale
      retention: 30d
      consumers: [console]
      exports: []
      replaces: []
  plan.tree.changed:
    address: ev.rocket.{env}.plan.tree.changed
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      key: "<root>"
      subject: "<root>"
      publisher: gate-db
      domain: plan
      ref: "/api/v1/agentrt/plan?root={root}"
      reconcile: "the ledger is the truth; GET /api/v1/agentrt/plan?root= is the plan"
      on_unread: stale
      retention: 30d
      # 2026-11-19: the Console reads the plan when told instead of every
      # 15 seconds (30,831 reads in 24 hours; the plan last changed on 11-12).
      consumers: [console]
      exports: []
      replaces: []
      console_keys: [[agent-runtime-plan], [agent-runtime-plan-view], [agent-runtime-progress]]
  owner.privilege.used:
    address: ev.rocket.{env}.owner.privilege.used
    x-bifrost:
      version: 1
      lane: event
      guarantee: durable
      subject: "<who>"
      publisher: gate-db
      domain: audit
      ref: "/api/v1/readings/evaluation"
      reconcile: "the ledger is the truth; the evaluation readout counts the day's events (owner_privilege_uses)"
      on_unread: stale
      retention: 400d
      # 2026-11-21 (the Owner, as the coordinator relayed it; law 68 in the
      # coordinator's notes, not yet in OWNER_LAW): each time the Owner steps in
      # to push work that lines wait on, or that no contract gives to anyone, is
      # one use of privilege; the fewer the better, counted every day as a
      # fixed reference (system archive, law 47). The coordinator records the
      # fact (POST /api/v1/bus/privilege, MCP record_privilege_use); Triage
      # may add the cause later in a second event of its own.
      consumers: [console]
      exports: []
      replaces: []
      body:
        - {name: who, kind: str, pattern: '^[a-z][a-z0-9_.:-]{0,63}$'}
        - {name: subject, kind: str}
        - {name: what, kind: str, pattern: '^[^\n]{1,300}$'}
        - {name: stuck_because, kind: str, pattern: '^[^\n]{1,300}$'}
