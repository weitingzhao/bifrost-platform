# The event ledger's own types (agentrt.event rows that are not bus topics).
# One register with ../rocket.yaml (the coordinator, 2026-11-17: one register,
# each domain registers its own): a type is listed here with the domain whose
# work it records (an id of config/domain-ownership.json). Bodies, value
# checks and hooks stay with eventlog.Declare in the owning domain's package;
# each domain's test checks its declared types are here under its domain.
# Split 2026-11-17 by the communication line, confirmed by the foundation line
# the same day against the package that Declares each type: the rule_* types
# go to verification (rulestore), owner_signoff to plan (planstore), and
# policy_alert, written by several domains each with its own rule, is a shared
# type of foundation like note. The *_seen types (approval, question, pipeline,
# deploy, ci) are written by seenfacts, foundation's recorder of outside
# systems' state, and declared there.
types:
  - {type: actor_registered, domain: foundation}
  - {type: approval_seen, domain: foundation}
  - {type: artifact_put, domain: foundation}
  - {type: artifact_refused, domain: foundation, note: "a report agentd uploaded that the platform refused (local path, another task's workspace); artifact (migration 0030, was policy_alert local_path/workspace_ref)"}
  - {type: attempt_cancelled, domain: compute}
  - {type: attempt_checkpointed, domain: compute}
  - {type: attempt_computed, domain: compute}
  - {type: attempt_ended, domain: compute}
  - {type: attempt_leased, domain: compute}
  - {type: attempt_lost, domain: compute}
  - {type: attempt_persisted, domain: compute}
  - {type: attempt_progress, domain: compute}
  - {type: attempt_renewed, domain: compute}
  - {type: attempt_salvaged, domain: compute}
  - {type: attempt_stale, domain: compute}
  - {type: attempt_started, domain: compute}
  - {type: attempt_submitted, domain: compute}
  - {type: budget_charged, domain: compute}
  - {type: candidate_status_changed, domain: compute}
  - {type: capability_scored, domain: compute}
  - {type: ci_red_classified, domain: verification}
  - {type: ci_reused, domain: verification}
  - {type: ci_seen, domain: foundation}
  - {type: control_cleared, domain: coordination}
  - {type: control_set, domain: coordination}
  - {type: controller_loop_failing, domain: foundation, note: "a controller loop failed the same way several times in a row; loopalert (migration 0029, was policy_alert controller_failing)"}
  - {type: controller_loop_recovered, domain: foundation, note: "a controller loop passes again; loopalert (migration 0029, was a note)"}
  - {type: decision_recorded, domain: plan}
  - {type: deploy_seen, domain: foundation}
  - {type: host_registered, domain: compute}
  - {type: host_retired, domain: compute}
  - {type: host_slots_set, domain: compute}
  - {type: host_state_changed, domain: compute}
  - {type: legacy_imported, domain: foundation}
  - {type: message_acked, domain: coordination}
  - {type: message_posted, domain: coordination}
  - {type: metric_label_set, domain: delivery}
  - {type: metrics_computed, domain: delivery}
  - {type: mission_amended, domain: plan}
  - {type: mission_proposed, domain: plan}
  - {type: mission_state_changed, domain: plan}
  - {type: note, domain: foundation}
  - {type: owner_signoff, domain: plan}
