# The event ledger's own types (agentrt.event rows that are not bus topics).
# One register with ../rocket.yaml (the coordinator, 2026-11-17: one register,
# each domain registers its own): a type is listed here with the domain whose
# work it records (an id of config/domain-ownership.json). Bodies, value
# checks and hooks stay with eventlog.Declare in the owning domain's package;
# each domain's test checks its declared types are here under its domain.
# Split 2026-11-17 by the communication line, confirmed by the foundation line
# the same day against the package that Declares each type: the rule_* types
# go to verification (rulestore), owner_signoff to plan (planstore), and
# policy_alert, written by several domains each with its own rule, is a shared
# type of foundation like note. The *_seen types (approval, question, pipeline,
# deploy, ci) are written by seenfacts, foundation's recorder of outside
# systems' state, and declared there.
types:
  - {type: action_traced, domain: foundation, note: "an action's trace (request, decision, result) for the review of automatic decisions; actionrecord (migration 0032, was a note)"}
  - {type: actor_registered, domain: foundation}
  - {type: approval_seen, domain: foundation}
  - {type: artifact_put, domain: foundation}
  - {type: artifact_refused, domain: foundation, note: "a report agentd uploaded that the platform refused (local path, another task's workspace); artifact (migration 0030, was policy_alert local_path/workspace_ref)"}
  - {type: attempt_cancelled, domain: compute}
  - {type: attempt_checkpointed, domain: compute}
  - {type: attempt_computed, domain: compute}
  - {type: attempt_ended, domain: compute}
  - {type: attempt_leased, domain: compute}
  - {type: attempt_lost, domain: compute}
