# Tenant demo's table (the drill, 2026-11-16, STG only).
tenant: demo
# A wake whose recipient is not a registered thread here goes to the duty
# seat, naming the address (2026-11-16, the tenant drill).
undeliverable_to: thread:local_98ab5bcb-6d1b-40e5-aa73-c2c27b3038a0
subscriptions:
  - id: drill
    on: [git.main.advanced]
    match: bifrost-platform
    deliver: wake
    to: thread:local_ab850773-fe26-40fa-ac01-b3b590b73164
    guarantee: durable
    by: dispatcher
    envs: [stg]
clients:
  - name: gate:events:demo-drill
    kind: reader
    lost_after: 10m
    note: the drill's reader; lost after ten minutes without reading
