# Who is woken by which event, for tenant rocket (2026-11-16, the coordinator
# for the Owner: one declarative table, one generic dispatcher; new reactions
# are new rows, not new code). A row decides who is told, never what may be
# done: an action row only asks for its action, which keeps its own tier,
# rules and approval (checked at registration, registry.CheckSubscriptions).
#
# deliver: wake   -> a message to the seat's inbox, which announces
#                    seat.mail.arrived; the seat's doorbell waits on that.
#          action -> (later) request a catalogued action.
#          notify -> (later) a phone notice.
# to (wake):  a literal address (seat:..., thread:...), or
#             commit.session -> the Claude-Session trailer of the event's commit.
# by: who delivers today. "dispatcher" is this table's generic dispatcher;
#     another value names hand-written code that still delivers it, to be
#     switched to the dispatcher after a side-by-side run.
tenant: rocket
# A wake whose recipient is not a registered thread here goes to the duty
# seat, naming the address (2026-11-16, the tenant drill).
undeliverable_to: thread:local_98ab5bcb-6d1b-40e5-aa73-c2c27b3038a0
subscriptions:
  - id: card-concluded-to-requester
    on: [approval.card.executed, approval.card.decided]
    deliver: wake
    to: ref.requester
    guarantee: durable
    by: approvals.thread-inbox
  - id: verdict-red-to-committer
    on: [ci.verdict.changed]
    change: red
    deliver: wake
    to: commit.session
    guarantee: durable
    by: dispatcher
  # A landing that did not land wakes whoever pushed the commit
  # (2026-11-17, the CI line: refusals were seen only in a Pod's log, and a
  # seat found out by measuring). The landing run's finish is already on the
  # bus; its subject's commit is the one pushed to ready/.
  - id: land-refused-to-pusher
    on: [ci.run.finished]
    match: "land-"
    change: "!succeeded"
    deliver: wake
    to: commit.session
    repos: [bifrost-platform, bifrost-trade-infra]
    # The land task writes why it refused (CI line, 11-17 08:53); the wake
    # carries it, so the pusher does not have to find the pod's log.
    params: {detail: "task-result:land/refusal"}
    guarantee: durable
    by: dispatcher
  # 2026-11-17 (the coordinator's tripwire, CI line): a landing that touched
  # the paths deciding whether the release loop may ship to PROD (the land
  # task's result tripwire) wakes the CI line and the coordinator with the
  # paths, the commit, the change ids and the branch. Alarm only: it stops
  # nothing. Other landings wake nobody (params.require).
  - id: land-tripwire-to-ci
    on: [ci.run.finished]
    match: "land-"
    deliver: wake
    to: thread:local_7de640c4-4b19-4a71-a0ac-ced2ce5fc7ff
    params: {detail: "task-result:land/tripwire,commit,change-ids,branch", require: tripwire}
    guarantee: durable
    by: dispatcher
  - id: land-tripwire-to-coordinator
    on: [ci.run.finished]
    match: "land-"
    deliver: wake
    to: thread:local_accccb4e-410c-4b5f-9f1b-b54c6915dc9a
    params: {detail: "task-result:land/tripwire,commit,change-ids,branch", require: tripwire}
    guarantee: durable
    by: dispatcher
  - id: mail-to-recipient
    on: [seat.mail.arrived]
    deliver: wake
    to: subject
    guarantee: durable
    by: platform-inbox
  # 2026-11-17 (the coordinator, after the nerve map showed release.deploy.finished
  # heard by no one): a release that reached an environment wakes whoever
  # wrote its commit (the deploy's subject is <env>/<lane>@<sha>, its ref names
  # the repo). Failed deploys are the CI line's (their own tripwire).
  - id: deploy-finished-to-committer
    on: [release.deploy.finished]
    change: succeeded
    deliver: wake
    to: commit.session
    guarantee: durable
    by: dispatcher
  # 2026-11-17 (the coordinator, the same reading: alert.rule.fired heard by no
  # one): a firing alert wakes the duty seat. Alertmanager re-sends while an
  # alert keeps firing (some 120 a day on PROD, 11-17): the duty seat sees
  # repeats until the rule's owner is woken instead (later, by domain).
  - id: alert-firing-to-duty
    on: [alert.rule.fired]
    change: firing
    deliver: wake
    to: thread:local_98ab5bcb-6d1b-40e5-aa73-c2c27b3038a0
    guarantee: durable
    by: dispatcher
  # A new approval card pages the Owner's phone through the bus (2026-11-17,
  # the coordinator). The approvals service's own direct push stays alongside
  # until this path has reached the phone several times, shown by the relay's
  # answers in the log ("bus: notify"); then the direct push is retired.
  # PROD only: approvals are made only on the PROD platform.
  - id: card-created-to-owner
    on: [approval.card.created]
    deliver: notify
    to: owner
    params:
      title: "Bus: approval {subject} waits for you"
      click: "http://ops.bifrost.lan/#approvals?id={ref_id}"
    guarantee: durable
    by: dispatcher
    envs: [prod]

  # What the phone is told directly today, side by side (2026-11-18): each row
  # records the push it would send ("bus: notify shadow" in the log) and sends
  # none, so nothing reaches the Owner twice. Taking one over is removing its
  # shadow line (and giving it its link) together with the direct push.
  # PROD only, like the cards.
  - id: question-asked-to-owner
    on: [owner.question.asked]
    deliver: notify
    to: owner
    shadow: true
    params:
      title: "Bus: question {subject} waits for you"
    guarantee: durable
    by: dispatcher
    envs: [prod]
  - id: policy-expiring-to-owner
    on: [release.policy.expiring]
    deliver: notify
    to: owner
    shadow: true
    params:
      title: "Bus: release policy {subject} {change}"
    guarantee: durable
    by: dispatcher
    envs: [prod]
  - id: liveness-to-owner
    on: [seat.liveness.changed]
    deliver: notify
    to: owner
    shadow: true
    params:
      title: "Bus: {subject} is {change}"
    guarantee: durable
    by: dispatcher
    envs: [prod]

  # A PROD release starts while main has known regressions still open: the
  # seat that asked for it is woken with them (2026-11-17, the coordinator:
  # information, no gate; the run's requester annotation, which the start
  # event carries as onbehalfof). Only when one is open (require: open).
  # PROD only: the seats are registered in PROD's ledger.
  - id: prod-release-open-regressions
    on: [ci.run.started]
    match: "-prod-"
    deliver: wake
    to: requester
    params:
      detail: "regressions:open"
      require: open
    guarantee: durable
    by: dispatcher
    envs: [prod]

# The bus's known users. name is the receipt consumer: gate:<route>:<client>
# for a reader of /bus/events (route events) or /bus/stream (route stream),
# the durable's name for a durable consumer. lost_after: how long without
# coming before it is shown as lost.
clients:
  - name: gate:stream:console
    kind: reader
    lost_after: 24h
    note: the Ops Bus page, open while someone looks at it
  - name: card-conclusions
    kind: durable
    lost_after: 168h
    domain: owner
    note: tells the seat that asked how its approval card ended, on each decision and result; the approvals' 15-second loop reconciles
  - name: question-conclusions
    kind: durable
    lost_after: 168h
    domain: owner
    note: tells the seat that asked the Owner's answer, on each answer; the questions' sweep reconciles
  - name: inbox-waiters
    kind: reader
    lost_after: 24h
    domain: coordination
    note: the seats waiting on their inbox (wait_for_messages, the doorbell), woken by seat.mail.arrived; a receipt only when one was waiting
  - name: headrelease
    kind: durable
    lost_after: 24h
    envs: [prod]
    domain: delivery
    note: PROD workers' automatic STG release; woken on main and on CI runs
  - name: postrelease
    kind: durable
    lost_after: 24h
    envs: [stg]
    domain: delivery
    note: the post-release check (on where POST_RELEASE_CHECK=observe, STG); woken by its pipeline's finished runs beside its 30-second loop
