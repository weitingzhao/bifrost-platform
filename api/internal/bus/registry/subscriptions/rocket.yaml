# Who is woken by which event, for tenant rocket: one declarative table, one
# generic dispatcher; new reactions are new rows, not new code (ISSUE-34). A row decides who is told, never what may be
# done: an action row only asks for its action, which keeps its own tier,
# rules and approval (checked at registration, registry.CheckSubscriptions).
#
# deliver: wake   -> a message to the seat's inbox, which announces
#                    seat.mail.arrived; the seat's doorbell waits on that.
#          action -> (later) request a catalogued action.
#          notify -> (later) a phone notice.
# to (wake):  a literal address (seat:..., thread:...), or
#             commit.session -> the Claude-Session trailer of the event's commit.
# by: who delivers today. "dispatcher" is this table's generic dispatcher;
#     another value names hand-written code that still delivers it, to be
#     switched to the dispatcher after a side-by-side run.
tenant: rocket
# A wake whose recipient is not a registered thread here goes to the duty
# seat, naming the address (2026-11-16, the tenant drill).
undeliverable_to: thread:local_accccb4e-410c-4b5f-9f1b-b54c6915dc9a
# ISSUE-41: the coordinator also keeps the duty; the duty seat's
# session is no longer used, so its rows and the undeliverable notices go there.
subscriptions:
  - id: card-concluded-to-requester
    on: [approval.card.executed, approval.card.decided]
    deliver: wake
    to: ref.requester
    guarantee: durable
    by: approvals.thread-inbox
  - id: verdict-red-to-committer
    on: [ci.verdict.changed]
    change: red
    deliver: wake
    to: commit.session
    guarantee: durable
    by: dispatcher
  # A known regression on main wakes whoever made the commit that introduced
  # it, recorded by a seat or by the unit declaration watch (2026-11-18:
  # a25c27aa broke the declaration and no one was told for 34 commits). The
  # subject names the commit, the ref the repository. A commit with no
  # Claude-Session trailer wakes nobody.
  - id: regression-to-introducer
    on: [main.regression.known]
    deliver: wake
    to: commit.session
    guarantee: durable
    by: dispatcher
  # A landing that did not land wakes whoever pushed the commit
  # (2026-11-17, the CI line: refusals were seen only in a Pod's log, and a
  # seat found out by measuring). The landing run's finish is already on the
  # bus; its subject's commit is the one pushed to ready/.
  - id: land-refused-to-pusher
    on: [ci.run.finished]
    match: "land-"
    change: "!succeeded"
    deliver: wake
    to: commit.session
    repos: [bifrost-platform, bifrost-trade-infra]
    # The land task writes why it refused (CI line, 11-17 08:53); the wake
    # carries it, so the pusher does not have to find the pod's log.
    params: {detail: "task-result:land/refusal"}
    guarantee: durable
    by: dispatcher
  # 2026-11-17 (the coordinator's tripwire, CI line): a landing that touched
  # the paths deciding whether the release loop may ship to PROD (the land
  # task's result tripwire) wakes the CI line and the coordinator with the
  # paths, the commit, the change ids and the branch. Alarm only: it stops
  # nothing. Other landings wake nobody (params.require).
  - id: land-tripwire-to-ci
    on: [ci.run.finished]
    match: "land-"
    deliver: wake
    to: thread:local_7de640c4-4b19-4a71-a0ac-ced2ce5fc7ff
    params: {detail: "task-result:land/tripwire,commit,change-ids,branch", require: tripwire}
    guarantee: durable
    by: dispatcher
  - id: land-tripwire-to-coordinator
    on: [ci.run.finished]
    match: "land-"
    deliver: wake
    to: thread:local_accccb4e-410c-4b5f-9f1b-b54c6915dc9a
    params: {detail: "task-result:land/tripwire,commit,change-ids,branch", require: tripwire}
    guarantee: durable
    by: dispatcher
  # 2026-11-21 (the main line "seen and felt", LAW-8): an ask nobody answered
  # for 4 hours, or two seats waiting on each other, wakes the coordinator,
  # whose job is chasing. Remove this row to stop it; the event is still kept.
  - id: ask-overdue-to-coordinator
    on: [seat.ask.overdue]
    deliver: wake
    to: thread:local_accccb4e-410c-4b5f-9f1b-b54c6915dc9a
    guarantee: durable
    by: dispatcher
  - id: mail-to-recipient
    on: [seat.mail.arrived]
    deliver: wake
    to: subject
    guarantee: durable
    by: platform-inbox
  # 2026-11-17 (the coordinator, after the nerve map showed release.deploy.finished
  # heard by no one): a release that reached an environment wakes whoever
  # wrote its commit (the deploy's subject is <env>/<lane>@<sha>, its ref names
  # the repo). 2026-11-18 (the coordinator): only PROD and failures. Of 65 such
  # letters to two seats in a day, 44 were never acknowledged, most of them a
  # successful STG deploy, which every commit gets. Read the acknowledged share
  # after a week.
  - id: deploy-finished-to-committer
    on: [release.deploy.finished]
    match: "prod/"
    change: succeeded
    deliver: wake
    to: commit.session
    guarantee: durable
    by: dispatcher
  # 2026-11-18: release.deploy.finished is written for successful runs only, so
  # a row on it never fired. A failed delivery or build is a ci.run.finished of
  # its pipeline, whatever the repository; the duty seat always hears of it,
  # because Trade and Research runs often have no session behind the commit.
  - id: deploy-failed-to-committer
    on: [ci.run.finished]
    match: "bifrost-deliver-"
    change: "!succeeded"
    deliver: wake
    to: commit.session
    params:
      ask_verdict: delivery
    guarantee: durable
    by: dispatcher
  - id: deploy-failed-to-duty
    on: [ci.run.finished]
    match: "bifrost-deliver-"
    change: "!succeeded"
    deliver: wake
    to: thread:local_accccb4e-410c-4b5f-9f1b-b54c6915dc9a
    params:
      ask_verdict: delivery
    guarantee: durable
    by: dispatcher
  - id: build-failed-to-duty
    on: [ci.run.finished]
    match: "bifrost-build-"
    change: "!succeeded"
    deliver: wake
    to: thread:local_accccb4e-410c-4b5f-9f1b-b54c6915dc9a
    params:
      ask_verdict: delivery
    guarantee: durable
    by: dispatcher
  # 2026-11-17 (the coordinator, the same reading: alert.rule.fired heard by no
  # one): a firing alert wakes the duty seat. 2026-11-18 (agreed with it): repeats
  # share a letter, one per alert per 6 hours or per day for one that keeps coming
  # back; production, critical, node pressure and Prometheus always get their own
  # (bus/alerts/letters.go).
  - id: alert-firing-to-duty
    on: [alert.rule.fired]
    # LAW-12's pain crossings wake the compute line alone (row below); the
    # duty seat sees them on the Bus page's stream (compute, 2026-11-19).
    except: ComputePain
    change: firing
    deliver: wake
    to: thread:local_accccb4e-410c-4b5f-9f1b-b54c6915dc9a
    params:
      always_namespaces: "bifrost-platform-prod,bifrost-prod"
      ask_verdict: alert
    guarantee: durable
    by: alert-letters
  # 2026-11-19, LAW-12 (compute's choice): a pain reading crossing its line
  # (ComputePain* alerts, warning) wakes the compute seat alone, asked for a
  # verdict; going back under stays on the bus. ComputePainDbGuestLoad is an
  # info reading for the guest audit and wakes no one.
  - id: alert-pain-to-compute
    on: [alert.rule.fired]
    match: ComputePain
    except: ComputePainDbGuestLoad
    change: firing
    deliver: wake
    to: thread:local_7dd39a39-1e0e-4878-b829-2e3f44d5589e
    params:
      ask_verdict: alert
    guarantee: durable
    by: dispatcher
  # The bus itself stopped (2026-11-20 02:55-04:10Z: NATS stuck with its node
  # drained, no alert fired; TD-588). The metrics line writes the two rules;
  # the communication line, which owns the bus, is woken by them and judges.
  # by: webhook: the alert webhook writes the letter itself, in the request
  # that wrote the alert, without NATS, so it arrives while the bus is down.
  - id: alert-bus-relay-to-comm
    on: [alert.rule.fired]
    match: BifrostBusRelayErrors
    change: firing
    deliver: wake
    to: thread:local_ab850773-fe26-40fa-ac01-b3b590b73164
    params:
      ask_verdict: alert
    guarantee: durable
    by: webhook
  - id: alert-nats-to-comm
    on: [alert.rule.fired]
    match: BifrostNatsUnavailable
    change: firing
    deliver: wake
    to: thread:local_ab850773-fe26-40fa-ac01-b3b590b73164
    params:
      ask_verdict: alert
    guarantee: durable
    by: webhook
  # 2026-11-18 (the communication line's list of problem channels, L10, R01, R09,
  # R11, R12): a probed service or plugin that turns to fail wakes the duty seat
  # once; degraded and recovery stay on the bus.
  - id: env-health-fail-to-duty
    on: [env.health.changed]
    change: fail
    deliver: wake
    to: thread:local_accccb4e-410c-4b5f-9f1b-b54c6915dc9a
    guarantee: durable
    by: dispatcher
  - id: plugin-status-fail-to-duty
    on: [plugin.status.changed]
    change: fail
    deliver: wake
    to: thread:local_accccb4e-410c-4b5f-9f1b-b54c6915dc9a
    guarantee: durable
    by: dispatcher
  # A new approval card pages the Owner's phone from this event (2026-11-18,
  # taken over from the direct push). The approvals service sends it, because
  # the notice is composed from the card and recorded on it, once per card; its
  # 15-second loop sends it if the event does not arrive within 30 seconds.
  - id: card-created-to-owner
    on: [approval.card.created]
    deliver: notify
    to: owner
    params:
      title: "Bus: approval {subject} waits for you"
      click: "http://ops.bifrost.lan/#approvals?id={ref_id}"
    guarantee: durable
    by: approvals.card-created-notice
    envs: [prod]

  # A PROD release starts while main has known regressions still open: the
  # seat that asked for it is woken with them (2026-11-17, the coordinator:
  # information, no gate; the run's requester annotation, which the start
  # event carries as onbehalfof). Only when one is open (require: open).
  # PROD only: the seats are registered in PROD's ledger.
  - id: prod-release-open-regressions
    on: [ci.run.started]
    match: "-prod-"
    deliver: wake
    to: requester
    params:
      detail: "regressions:open"
      require: open
    guarantee: durable
    by: dispatcher
    envs: [prod]

# The bus's known users. name is the receipt consumer: gate:<route>:<client>
# for a reader of /bus/events (route events) or /bus/stream (route stream),
# the durable's name for a durable consumer. lost_after: how long without
# coming before it is shown as lost.
clients:
  - name: gate:stream:console
    kind: reader
    lost_after: 24h
    note: the Ops Bus page, open while someone looks at it
  - name: release-recorder
    kind: durable
    lost_after: 168h
    domain: delivery
    note: asks the release recorder for a pass when a run ends; its own interval reconciles
  - name: alert-letters
    kind: durable
    lost_after: 168h
    domain: coordination
    note: writes the duty seat its alert letters; repeats of one alert share a letter (bus/alerts), urgent ones never do
  - name: window-queue
    kind: durable
    lost_after: 168h
    domain: delivery
    note: moves the release window's queue on when the window changes, so the next in line is told at once; a periodic pass handles a hold that runs out
  - name: unit-watch
    kind: durable
    lost_after: 168h
    envs: [prod]
    domain: verification
    note: reads main's unit declaration on each advance of main; records a known regression when it stops reading and the fix when it reads again
  - name: card-created-notice
    kind: durable
    lost_after: 168h
    domain: approvals
    note: sends the Owner the first notice of a new approval card; the approvals loop covers a missed event after 30 seconds
  - name: card-conclusions
    kind: durable
    lost_after: 168h
    domain: approvals
    note: tells the seat that asked how its approval card ended, on each decision and result; the approvals' 15-second loop reconciles
  - name: question-conclusions
    kind: durable
    lost_after: 168h
    domain: approvals
    note: tells the seat that asked the Owner's answer, on each answer; the questions' sweep reconciles
  - name: inbox-waiters
    kind: reader
    lost_after: 24h
    domain: coordination
    note: the seats waiting on their inbox (wait_for_messages, the doorbell), woken by seat.mail.arrived; a receipt only when one was waiting
  - name: headrelease
    kind: durable
    lost_after: 24h
    envs: [prod]
    domain: delivery
    note: PROD workers' automatic STG release; woken on main and on CI runs
