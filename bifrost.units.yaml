# What CI tests in this repository, and with what (CI design v4 §3.2, landing
# stage 2). The platform reads this file from a commit's tree and computes the
# plan: one unit a Go package with tests, one for the console, one for the
# repository's own checks; each task of a unit has a key, the hash of exactly
# what it reads. Same key, same result: it is not run again.
#
#   go run ./api/cmd/unitplan -repo . -commit HEAD -pin bifrost-ui=../bifrost-ui -pin bifrost-trade-infra=../bifrost-trade-infra
#
# prints the plan of a commit from local clones.
version: 1

# The other repositories this one is tested with, each at a commit. A key
# takes the tree of what is used at that commit, not the commit: moving a pin
# changes only the keys of what reads something that changed. advance: manual
# means whoever needs a newer one changes this line (and, for infra, the copy
# of its pipelines in api/internal/delivery/testdata in the same commit).
pins:
  bifrost-ui: {commit: c83f40b40e65e52f8592ec6b73c5f6987c116e93, advance: manual}
  bifrost-trade-infra: {commit: 7361ee69a5b250999a43b7c6bded374a57e4b007, advance: manual}

modules:
  - name: api
    kind: go
    root: api
    # The image the Go tasks of bifrost-ci-platform ran in on 2026-11-13.
    image: docker.io/library/golang:1.25-bookworm@sha256:3b4a11519ad929d1e1d261a12cff056f0c85b735253d7d861346b9c6f8b36437
    template: bifrost-unit-run-db
    db-roles: agentrt_owner_dev+platform_agentrt_dev+platform_agentrt_stg+agent_reader
    # The task template the units run in is an input of every one of them: its
    # definition carries the database and Redis images.
    needs: ["bifrost-trade-infra:k8s/cicd/tekton/task-unit-run-db.yaml"]
    tasks:
      vet: {per: module}
      test: {per: package}
    shards:
      api/internal/agentrt/store: 8
    # What a package's tests read that its imports do not show. "." is the
    # whole repository and every pin: the package is tested again whenever
    # anything changes, and still only once for the same content. Every
    # package here has a test that walks up from its directory, walks a
    # directory, runs a command or opens a file by a computed path (searched
    # 2026-11-13: 58 of 96 packages with tests; it includes the 38 the experiments found reading
    # outside). Naming exactly what each reads, in place of ".", is what makes
    # it run less often; a package missing from this list that does read
    # outside is the dangerous mistake.
    inputs:
      api/internal/topology: ["api/internal/topology"]
      # Narrowed 2026-11-14 (biz-align, two batches): each entry that is not
      # "." was run with scripts/ci/unit-go-test holding the package's reads
      # to exactly what the entry lists beyond its own directory, and passed.
      # An entry of only its own directory read nothing outside itself; it
      # stays listed because the search that built this list matches it.
      # The check does not see what a child process reads, so the tests that
      # run one were read (third batch): they re-run their own test binary,
      # run git or ssh-keygen in a temporary directory, run scripts their
      # own code generates, or run "go list" / "go mod tidy" inside api/,
      # which an entry of "api" covers. unitscript runs scripts/ci's scripts
      # and is given scripts and console whole. An entry of "api" is a test
      # that walks the Go tree (a guard); it reruns on any Go change.
      # agentrt/rules still walks the whole repository and stays "."; so does
      # repoguard, which is one test made for that.
      api/cmd/agentrt-plan-import: ["api/cmd/agentrt-plan-import", "api/internal/agentrt/planimport/testdata"]
      api/cmd/infracheck: ["api/cmd/infracheck", "api/internal/agentrt/infracheck/testdata"]
      api/cmd/platform-api: ["api/cmd/platform-api"]
      api/internal/actions:
        - "api/internal/actions"
        - "api/internal/config"
        - "api/internal/server"
        - "config/actions-catalog.json"
        - "config/actuation-policy.yaml"
        - "config/agent-tasks.yaml"
      api/internal/actuation: ["api/internal/actuation"]
      api/internal/actuationpolicy:
        - "api/internal/actuationpolicy"
        - "api/internal/actions"
        - "api/internal/delivery"
        - "api/internal/workactions"
        - "config/actuation-policy.yaml"
      api/internal/agentgovernance:
        - "api/internal/agentgovernance"
        - "api/internal/config"
        - "config/agent-tasks.yaml"
        - "config/trust-overrides.yaml"
      # CI configuration read model, independent of HTTP wiring.
      api/internal/ciconfig: ["api/internal/ciconfig"]
      api/internal/unitwatch: ["api/internal/unitwatch"]
      api/internal/cirunview: ["api/internal/cirunview"]
      api/internal/resourceview: ["api/internal/resourceview"]
      api/internal/tenant/appreadings: ["api/internal/tenant/appreadings"]
      # Foundation: HTTP observations, moved out of server; no domain inputs.
      # Its test parses two of its own files (prod_shadow_test.go: the shadow
      # names nothing that acts); it reads nothing outside the directory.
      api/internal/headrelease: ["api/internal/headrelease"]
      api/internal/httpmetrics: ["api/internal/httpmetrics"]
      # 2026-11-17: its tests check each channel's and ledger type's domain against the
      # ownership table, and the register against the latest closed vocabulary migration.
      api/internal/bus/registry: ["api/internal/bus/registry", "config/domain-ownership.json", "api/internal/agentrt/migrations"]
      api/internal/agentrt/agentrtapi:
        - "api/internal/agentrt/agentrtapi"
        - "api/internal/agentrt/planimport/testdata"
        - "api/internal/agentrt/planview/testdata"
        - "api/internal/agentrt/planstore"
        - "api/internal/agentrt/store"
        - "console/src/api/agentRuntime.ts"
      # Domain 4: delivery-stage read projection; no release authority.
      api/internal/agentrt/deliveryreadings: ["api/internal/agentrt/deliveryreadings"]
      api/internal/agentrt/loopreadings: ["api/internal/agentrt/loopreadings"]
      # 2026-11-17: TestLoopTypesAreRegistered reads the event register.
      api/internal/agentrt/loopalert: ["api/internal/agentrt/loopalert", "api/internal/bus/registry/ledger"]
      # 2026-11-17: TestRefusalTypeIsRegistered reads the event register.
      api/internal/agentrt/artifact: ["api/internal/agentrt/artifact", "api/internal/bus/registry/ledger"]
      # 2026-11-17: TestFullCINotedIsRegistered reads the event register.
      api/internal/agentrt/evidence: ["api/internal/agentrt/evidence", "api/internal/bus/registry/ledger"]
      # 2026-11-17: TestNotedTypeIsRegistered reads the event register.
      api/internal/agentrt/externalwork: ["api/internal/agentrt/externalwork", "api/internal/bus/registry/ledger"]
      # 2026-11-18: TestTheEventTypeIsRegisteredUnderOwner reads the event register.
      api/internal/homelayout: ["api/internal/homelayout", "api/internal/bus/registry/ledger"]
      # 2026-11-17: TestTracedTypeIsRegistered reads the event register.
      api/internal/agentrt/actionrecord: ["api/internal/agentrt/actionrecord", "api/internal/bus/registry/ledger"]
      # 2026-11-17: TestPolicyAlertIsRegisteredUnderCoordination reads the event register.
      api/internal/agentrt/coord: ["api/internal/agentrt/coord", "api/internal/bus/registry/ledger"]
      api/internal/agentrt/deliveryview: ["api/internal/agentrt/deliveryview"]
      api/internal/agentrt/canon: ["api/internal/agentrt/canon"]
      api/internal/agentrt/infracheck: ["api/internal/agentrt/infracheck"]
      api/internal/agentrt/landingci: ["api/internal/agentrt/landingci"]
      api/internal/agentrt/landinggit: ["api/internal/agentrt/landinggit"]
      api/internal/agentrt/planimport:
        - "api/internal/agentrt/planimport"
        - "console/src/api/__fixtures__/agentrt-plan-imported.testdb.json"
        - "console/src/api/__fixtures__/agentrt-plan-moved.testdb.json"
        - "console/src/api/__fixtures__/agentrt-plan-view.go.json"
      # Domain 1: pace, ETA and Owner-time projections; storage is an adapter.
      api/internal/agentrt/planpace: ["api/internal/agentrt/planpace"]
      # Plan observation reader: caller-owned transaction, no store dependency.
      api/internal/agentrt/planreadings: ["api/internal/agentrt/planreadings"]
      api/internal/agentrt/workregistration: ["api/internal/agentrt/workregistration"]
      api/internal/agentrt/planview: ["api/internal/agentrt/planview"]
      # Plan domain: the plan code moved out of store (2026-11-17). Its tests
      # read one plan view of planview's testdata and two Console fixtures.
      api/internal/agentrt/planstore:
        - "api/internal/agentrt/planstore"
        - "api/internal/agentrt/planview/testdata"
        - "console/src/api/__fixtures__/plan-view-collector.generated.json"
        - "console/src/api/__fixtures__/plan-view-signoff.generated.json"
        # 2026-11-17: TestPlanVocabularyIsRegistered reads the event register.
        - "api/internal/bus/registry/ledger"
      api/internal/agentrt/recorderimport: ["api/internal/agentrt/recorderimport"]
      # 2026-11-17: TestSeenFactsAreRegistered reads the event register.
      api/internal/agentrt/seenfacts: ["api/internal/agentrt/seenfacts", "api/internal/bus/registry/ledger"]
      api/internal/agentrt/rules: ["."]
      api/internal/agentrt/store:
        - "api/internal/agentrt/store"
        - "api/internal/agentrt/controller"
        - "api/internal/agentrt/migrations"
        - "api/internal/agentrt/planimport/testdata"
        - "api/internal/agentrt/planview/testdata"
        - "api/internal/delivery/testdata"
        - "api/internal/server"
        - "console/src/api/__fixtures__"
      api/internal/agentthreads:
        - "api/internal/agentthreads"
        - "console/src/api/__fixtures__/agent-threads-sessions.generated.json"
        - "console/src/api/__fixtures__/agent-threads.generated.json"
      api/internal/approvals: ["api/internal/approvals", "api/internal/config", "config/agent-tasks.yaml"]
      api/internal/approvals/mustrefuse: ["api/internal/approvals/mustrefuse"]
      api/internal/checklist: ["api/internal/checklist"]
      api/internal/cluster: ["api/internal/cluster"]
      # Foundation: PostgreSQL and Redis status reads, moved out of cluster 2026-11-18;
      # its tests read nothing outside the directory.
      api/internal/datastore: ["api/internal/datastore"]
      # Guards that read every Go file of the module, and the walls between
      # packages (go list -deps); moved here from delivery and questions so
      # that those are rerun for their own changes.
      # The communication layer's registers of its change of generation: their
      # tests check every retired channel is gone from the Go code and every
      # moved reader's code is there, so they read the whole module.
      api/internal/bus/nextgen: ["api"]
      api/internal/codeguard: ["api", "config/domain-ownership.json"]
      api/internal/config: ["api/internal/config", "config/environments.yaml"]
      api/internal/delivery: ["api/internal/delivery", "bifrost-trade-infra:k8s/cicd"]
      api/internal/devsession: ["api/internal/devsession", "config/sessions-catalog.yaml"]
      # Reads the ruler, the ownership table and the wall tests the ruler names,
      # and runs "go list" inside api/ to score the tree it is in.
      api/internal/domainscore: ["api", "config/quality-ruler.json", "config/domain-ownership.json"]
      api/internal/localpath: ["api/internal/localpath"]
      api/internal/maintainer:
        - "api/internal/maintainer"
        - "api/internal/agentthreads"
        - "api/internal/checklist"
        - "api/internal/cluster"
        - "api/internal/dataclone"
        - "api/internal/ibgateway"
        - "api/internal/patrol"
        - "api/internal/releasepolicy"
        - "api/internal/releases"
      api/internal/modtidy: ["api"]
      api/internal/network: ["api/internal/network"]
      api/internal/notice: ["api/internal/notice", "api/internal/questions/testdata/canonical/vectors.json"]
      api/internal/opscontext: ["api/internal/opscontext", "config/ops-context.yaml"]
      # Its tests run scripts/ci/outside_inputs.sh and parse the test files under api/.
      api/internal/outsideinput: ["api", "scripts/ci", "bifrost-trade-infra:k8s/cicd", "bifrost-trade-infra:scripts/release"]
      api/internal/opsfacts: ["api/internal/opsfacts"]
      api/internal/ownerexec: ["api/internal/ownerexec"]
      api/internal/ownerexec/mustrefuse: ["api/internal/ownerexec/mustrefuse"]
      api/internal/patrol: ["api/internal/patrol", "config/patrol-skills"]
      api/internal/probe: ["api/internal/probe", "config/trade-api-domains.yaml"]
      api/internal/questions: ["api/internal/questions", "api/internal/server"]
      api/internal/releasefreeze: ["api/internal/releasefreeze", "bifrost-trade-infra:scripts/release"]
      api/internal/releasepolicy: ["api/internal/releasepolicy"]
      api/internal/releasepolicy/mustrefuse: ["api/internal/releasepolicy/mustrefuse"]
      # The guard that reads every file of the repository (moved from cluster).
      api/internal/repoguard: ["."]
      api/internal/safego: ["api"]
      api/internal/selfhealth: ["api/internal/selfhealth", "config/clusters.yaml"]
      # Read-only Owner statistics share the exact Console contract, not the server tree.
      api/internal/approvalreadings: ["api/internal/approvalreadings", "api/internal/server/testdata/contract/readings"]
      api/internal/server: ["api", "config/agent-tasks.yaml", "config/domain-ownership.json"]
      api/internal/statefile: ["api/internal/statefile"]
      api/internal/storedurability: ["api"]
      api/internal/testscope: ["api"]
      api/internal/unitscript: ["api", "scripts", "bifrost.units.yaml", "console"]
      # Reads only its own testdata (four real TaskRuns) and the test database.
      api/internal/unitexec: ["api/internal/unitexec/testdata"]
      api/internal/tradevocab: ["api"]

  - name: console
    kind: node
    root: console
    # The last five are the files under api/ the console's tests read
    # (scripts/ci/console_reads_api.txt; consoleReadsApi.test.ts keeps that
    # list whole, TestConsoleDeclaresWhatItsTestsReadUnderAPI keeps this one
    # equal to it). Without them a change to one of those files would leave
    # the console's keys as they were. Filled in by the CI line on 2026-11-14;
    # the module's owners may turn them into contracts.
    needs:
      - "bifrost-ui:."
      - "bifrost-trade-infra:k8s/cicd/tekton/task-unit-run.yaml"
      - api/internal/questions/testdata/contract
      # The contract of CI's own views with the units routes: kept by the
      # api side, read by the console's CI tests (Owner, 2026-11-14: CI asks
      # of itself what it asks of the products that run on it).
      - api/internal/server/testdata/contract/units
      - api/internal/server/testdata/contract/readings
      - api/internal/approvals/types.go
      - api/internal/approvals/handler.go
      - api/internal/mcp/catalog.go
      - api/internal/server/console_notification_contract.go
      # Measured 2026-11-14 by running the console's tests with every file
      # access recorded: beside the five above they read these. A replay of
      # 150 commits of main had found six that changed only mcp/ and would
      # have left the console's keys as they were.
      - mcp/platform
      - mcp/trade/src
      - agent/remediation/src
      - config/trade-api-domains.yaml
      # Frontend ownership inventory tests read the source-owned attribution.
      - config/domain-ownership.json
      - scripts/ci/console_reads_api.txt
    image: docker.io/library/node:20-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
    template: bifrost-unit-run
    tasks:
      typecheck: {}
      lint: {}
      test: {shards: 4}
      build: {}

  - name: repo
    root: .
    # The alpine the pipeline's check-spine and code-health tasks ran in on
    # 2026-11-13 (the digest the cluster had pulled); scripts/ci/unit-check
    # adds bash and git to it with apk, as those tasks did.
    image: docker.io/library/alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    template: bifrost-unit-run
    tasks:
      check: {needs: ["bifrost-trade-infra:agent-config/scripts/code-health", "bifrost-trade-infra:k8s/cicd/tekton/task-unit-run.yaml"]}
