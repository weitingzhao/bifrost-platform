    - id: D-Loop-Smartness-Y2
      status: SIGNED
      topic: Research Loop Wave Y.2 — Harness LLM plan step
      conclusion: |
        Wave Y.2 upgrades `_plan_for_objective` from a static 4-step template
        into a dynamic plan produced by DeepSeek Reasoner (OpenAI-compatible
        endpoint via `DEEPSEEK_BASE_URL`, default https://api.deepseek.com/v1).

        Owner decisions (2026-08-29):
          A1 — Trigger: env `BIFROST_HARNESS_LLM_PLAN=1` global switch;
               `objective.policy_json.use_llm_plan` (bool) may override
               (true forces on even when env is off; false forces off even
               when env is on).  Default: heuristic template.
          B2 — LLM authority: may add/remove/reorder steps whose `op` is in
               the whitelist `{scan_universe, signal_decay_check,
               propose_candidates, await_approval}`, and may emit
               `plan.policy_suggestion` as advisory.  Runtime NEVER mutates
               `objective.policy_json` from LLM output — Owner still owns
               policy changes.
          C1 — No data reflow: LLM sees only objective (title/description/
               persona/schedule) + `policy_json`.  Scan/decay reads stay in
               the propose stage.  Prompt is a stable JSON envelope; no
               `features.*` snapshots leak into the LLM context in Y.2.
          E3 — Default model `deepseek-reasoner`;
               `policy_json.llm_model` may override (e.g. `deepseek-chat`
               for a faster/cheaper mode).

        Implementation (`bifrost_research.copilot.harness.plan_llm`):
          - Pydantic `LLMPlanResponse` with `steps: list[LLMPlanStep]`
            (min_length=1, max_length=12), `reasoning`, `policy_suggestion`.
          - `LLMPlanStep.op` is whitelist-validated.
          - `generate_plan_llm()` is fully fail-soft — returns `None` (so the
            runtime uses heuristic) on:
              disabled (env off & policy unset / policy=false),
              missing `DEEPSEEK_API_KEY`, httpx timeout (default 15.0s) /
              network error / HTTP 4xx-5xx, non-JSON body, empty choices,
              content that cannot be parsed to a JSON object (supports
              ```json ... ``` fences + prose preamble), Pydantic schema
              violation (e.g. op not in whitelist, empty steps).
          - Runtime `_plan_for_objective` merges LLM steps onto the static
            scaffold; plan carries `generated_by` (`"llm" | "heuristic"`),
            optional `llm_model` / `llm_reasoning` / `policy_suggestion`,
            and `fallback_reason` when heuristic was chosen.  Trace's
            `step: plan` event now visibly reports which planner produced
            the plan.

        Testing: 20 new tests in `test_harness_plan_llm.py`
          (env / policy matrix, JSON parse variants, happy path, model
           override, base_url override, timeout, connection error, HTTP
           4xx, non-JSON body, empty choices, unparseable content,
           missing steps, empty steps, op-not-in-whitelist, fenced JSON).
          Plus 3 new tests in `test_harness_runtime.py` covering the
          heuristic / LLM / fallback branches of `_plan_for_objective`.

        Cost & safety: harness invokes DeepSeek once per objective run
        (short prompt, no tool loop).  15s hard timeout keeps the run
        latency-bounded; runs never fail because the LLM failed.  D10
        BLOCKED — the plan step describes *what to do next*, it does not
        touch Trade DB, IB Operator, or place_order.  No new external
        Python dependency (uses existing `httpx>=0.27`).

        Deferred to Y.3: converting `min_hit_rate` from advisory to
        must-pass gating; per-symbol decay gate; policy_suggestion review UI.
      signed_at: "2026-08-29"
      authority: "bifrost-research 0.48.1 harness/plan_llm.py + runtime._plan_for_objective"
    - id: D-Loop-Smartness-Y3
      status: SIGNED
      topic: Research Loop Wave Y.3 — Hit-rate gate + policy_suggestion approval loop
      conclusion: |
        Wave Y.3 closes the Loop Smartness arc by turning two Y.1/Y.2
        advisories into effective decision surfaces WITHOUT weakening
        Owner authority (D10 stays BLOCKED).

        Owner decisions (2026-08-29):
          A1 — policy_suggestion falls into Decision Inbox as an
               independent draft (kind=`policy_suggestion`).  On approve,
               `objective_repo.patch_policy_json` merges the suggestion
               onto `objective.policy_json` via jsonb `||`.  Reject leaves
               the objective untouched.  Runtime NEVER auto-applies.
          B3 — filter-scoped hit-rate gate: when
               `policy.min_hit_rate` and `policy.flag_filter` are BOTH
               set, only lenses named in the flag_filter are checked
               (e.g. `flag_filter=iv_rank:hot,vrp:hot` → check
               `iv_rank` and `vrp` in `global_signal_decay_summary`).
               A lens fails when `hit_rate_20d < min_hit_rate` OR `n == 0`.
          C3 — Gate failure is a WARN, not a stop: the run still ends in
               `awaiting_approval`, candidate_batch draft carries
               `hit_rate_warn: true` plus the full `hit_rate_gate`
               diagnostic (`applied / ok / failing / lens_results`), and
               Owner decides in Decision Inbox.  No new run-status enum.
          R3 — Ship A + B + C together in a single wave.

        Implementation
          - `repositories.objective.patch_policy_json(conn, oid, patch, *,
             whitelist=POLICY_SUGGESTION_WHITELIST)`: jsonb `||` merge with
             a `{preset, flag_filter, min_composite_score, min_hit_rate,
             max_candidates}` whitelist.  Empty filtered patch → returns
             current objective row unchanged.  Non-mapping input →
             TypeError.
          - `copilot.harness.plan_llm.LLMPlanResponse` gains a
             `policy_suggestion` field_validator (mode="before") that
             silently drops out-of-whitelist keys before schema validation.
             Non-object input raises `ValueError` (Pydantic wraps →
             ValidationError → fail-soft None).  Double defense: the
             repository layer filters again at approve time.
          - `copilot.harness.runtime`:
              * `_apply_hit_rate_gate(policy, decay_summary, flag_filter)`
                returns a rich diagnostic dict.  Gate is skipped when
                either config knob is missing.
              * `_policy_suggestion_from_plan(plan, current_policy)`
                emits the actionable diff (only keys that changed value).
                Empty diff → no draft created.
              * `run_objective`: step 2b runs the gate and appends a
                `hit_rate_gate` trace event; step 5 adds `hit_rate_warn`
                to the candidate_batch payload when gate.applied ∧ !ok;
                step 6 (new) inserts an independent `policy_suggestion`
                draft + action pair when the LLM plan surfaced a
                non-trivial diff.  `outputs` now carries
                `policy_suggestion_draft_id` (nullable) +
                `hit_rate_gate` copy so Console can render without
                re-reading the run trace.
          - `api.agents.approve_draft`: new branch for kind
             `policy_suggestion` — fetches the target objective (404 if
             missing), calls `patch_policy_json` with the suggestion,
             stamps `executed.objective` + `executed.applied_suggestion`.
             Rejects malformed drafts (missing objective_id / suggestion)
             with 400.  Draft transitions to `approved`; linked action
             promoted to `executed` via the existing pathway.

        Testing (35 new tests, 497 backend passed total):
          - runtime: 4 gate branches, 5 gate helpers, 5 suggestion diff,
            4 integration tests (gate pass no warn, gate fail with warn,
            LLM policy_suggestion creates draft, no-diff = no draft,
            heuristic path = no draft).
          - plan_llm: 3 whitelist enforcement tests (partial-drop,
            all-dropped-becomes-none, non-object rejected).
          - repositories: 6 patch_policy_json tests (whitelist filter,
            empty patch, multi-key merge SQL, whitelist=None disable,
            non-mapping raises, missing objective).
          - api: 5 approve_policy_suggestion tests (happy path merge,
            missing objective_id, missing suggestion, unknown objective
            404, non-pending draft 409).

        D10 posture: Y.3 only writes `research.objective.policy_json` on
        Owner-approved drafts.  No new touchpoints to Trade DB, IB
        Operator, `ib:operator:cmd`, or `place_order`.  LLM output is
        filtered TWICE (pydantic + repositories) before it can influence
        harness behavior on the next run.

        FE follow-up (Wave Y.3-FE, same day):
          * `bifrost-trade-frontend/src/api/researchDrafts.ts` — DraftKind
            union extended with `candidate_batch` + `policy_suggestion`.
          * `src/lib/harness/harnessDraftHelpers.ts` (new) — pure helpers
            `computePolicySuggestionRows` (whitelist-scoped diff rows),
            `isHitRateWarnActive`, `hitRateFailingLenses`,
            `candidateBatchItems`, `formatPolicyValue`.  12 vitest cases.
          * `src/components/cockpit/DraftCard.tsx` — kind switch:
              - candidate_batch → items list + `data_source` badge +
                warn banner when `hit_rate_warn === true` (yellow border
                + failing lens callout).
              - policy_suggestion → side-by-side diff table (current →
                proposed) with changed rows highlighted; LLM model tag +
                reasoning quote.
          * `src/pages/research/loop/DecisionInboxPage.tsx` — new
            "Loop" filter chip surfacing candidate_batch +
            policy_suggestion; existing "Decisions" chip unchanged.
          * FE gate: 48/48 vitest files pass (351 total; +12 for
            harnessDraftHelpers), `npm run lint / build /
            check:legacy-css` clean.

        Deferred (post-Y.3):
          * Per-symbol hit-rate gate (requires new
            `features.stock_signal_lens_hit_daily` per-symbol projection).
          * Auto-scheduling: currently the Owner still triggers each run
            manually.
      signed_at: "2026-08-29"
      authority: "bifrost-research 0.48.2 harness/runtime + repositories/objective + api/agents; bifrost-trade-frontend cockpit/DraftCard + lib/harness"
