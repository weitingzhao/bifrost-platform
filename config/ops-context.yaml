#
# Milestone status semantics (Spine layer — historical Owner sign-off):
#   SIGNED      — Owner historically approved this milestone's scope
#   CLOSED      — Fully completed and archived (no further action)
#   IN_PROGRESS — Active work ongoing
#   NOT_STARTED — Planned, no work started
#   BLOCKED_ON  — Blocked by named dependency
# SIGNED ≠ "currently ready" — live gate readiness from Projection (matrix / Promote evaluation).

