    - id: D-Trade-FE-Poll-Contract
      status: SIGNED
      topic: Trade FE poll & focus contract (Cursor-Browser compat)
      conclusion: |
        FE-only performance contract for TanStack Query poll + SSE lifecycle.
        Rationale: Cursor's embedded browser keeps `document.visibilityState`
        always "visible", so TanStack Query's default background-throttle
        never fires and layout-level polls (5s/6s/8s) starve the IDE main
        thread.
        Contract v1:
          1. `src/lib/appFocus.ts` is the single source of app focus/idle;
             all queries + SSE derive pause/resume from `focusManager` +
             `subscribeAppFocus`.  Idle threshold = 60s of no keyboard /
             pointer activity, OR window blur, OR document hidden.
          2. `queryClient` sets `refetchIntervalInBackground: false`; do
             not override at the query call site — use idle-safe patterns.
          3. `openSseWithBackoff` pauses connections while idle by default;
             opt out only for streams that must stay open.
          4. Layout-level poll floor: 15s (daemon status, open orders),
             30s (system topology).  Anything faster requires spine
             follow-up (`D-Trade-FE-Poll-Contract` amendment).
        Scope: Trade FE only (Product mode).  Ops Console and Plugins
        may adopt independently.
      signed_at: "2026-08-29"
      authority: "bifrost-trade-frontend src/lib/{appFocus,queryClient,sse}.ts"
