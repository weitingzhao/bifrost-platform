# Program Blueprint Schema
# ============================================================
# Each YAML file under this tree defines a Program Blueprint —
# declarative phases for Delivery Board sign-off and optional
# Cursor SDK execution via api/internal/devagent.
# ============================================================

# --- Convention ---
#
# Program ID
#   Format: {domain}-{intent}[-{qualifier}] kebab-case
#   Regex (stock / loaded ids):  ^[a-z0-9]+(-[a-z0-9]+){1,5}(--[a-z0-9-]+)?$
#   Max length: 40 characters
#   Do not invent undeclared abbreviations.
#   New from-template ids: {lane}-{yyyymmdd}[-n]
#     e.g. trade-stack-20260809, trade-stack-20260809-2
#   Do not create new ids containing `--`. Legacy `--` shells are archived.
#   Do not create new empty-shell template instances.
#   Existing empty/CLOSED shells are status: archived.
#
# Phase ID
#   Legal: ^P[0-9]+$  OR  ^[a-z][a-z0-9-]{0,20}$
#   Default for new programs: P1, P2, … (do not start new programs at P0)
#   Stock P0…Pn on existing programs is allowed; do not renumber blindly.
#   Semantic slugs are for non-linear steps (design, implement, verify, rollout-stg).
#   Legacy allowlist (validator does not warn):
#     program vision only — V1–V5 and S3
#     program network-governance only — NG1–NG8 (deferred: 8 phases + verify_cmd complexity)
#   Deferred migration: active programs with 8+ phases may defer phase-id migration
#     when depends_on / verify_cmd / script rewiring is disproportionately complex.
#     Validator silences the exempted prefixes; migrate when the program next needs edits.
#   Forbidden (active programs warn):
#     undeclared prefixes (TIBM*, SMOKE-*, NG*, IBGP*, …)
#     priority-descending Q{n} (Q3→Q2→Q1)
#     mixing W{n} with P{n} without a semantic slug declaration
#
# Status lifecycle
#   active → completed → archived
#   completed = all phases done and Owner confirmed
#   archived  = hidden from default GET /api/v1/programs
#               (visible with ?include_archived=true or full-dump mode)
#
# Close-out
#   Closing a program = set YAML status (+ phase status: done) then move the file:
#     active/ → completed/ or archived/
#   Runtime state JSON under data/programs/ is disposable scratch, not the
#   capability ledger. completed/archived programs may have no state file.
#   Activating a completed or archived program returns 409.
#
# from-template bases
#   Clone sources must use legal phase ids (P{n} or semantic slug).
#   Closed capability blueprints (NG*, IBGP*, …) are not clone sources.
#   Ground / Plugin spawn from archived skeletons ground-session / plugin-session.
#
# Storage layout
#   config/programs/
#     _schema.yaml
#     _templates.yaml
#     example-template.yaml
#     active/*.yaml
#     completed/*.yaml
#     archived/*.yaml
#   Loader walks recursively; skips basename starting with "_" and example-*.
#
# Phase aliases
#   Optional phases[].aliases: ["TIBM0"] — old ids accepted on start/sign-off
#   and remapped when loading persisted state.

# --- Top-level fields ---

id: string
title: string
description: string
status: enum            # active | completed | archived

# --- Delivery Board (Wave 2) ---

delivery:
  board_visible: bool   # true → listed on Mission Control → Delivery Board
  former_location: string
  sign_off_mechanism: enum   # api only (D12 — dev_agent/vision_gate removed Wave 3)

# --- Execution context (optional for delivery-only programs) ---

workspace: string
skill_path: string
model: string           # defaults to composer-2.5

# --- Phases ---

phases:
  - id: string
    aliases: [string]   # optional legacy ids remapped to id
    title: string
    status: enum        # pending | done | skipped
    prompt_template: string
    verify_cmd: string
    acceptance: [string]
    depends_on: [string]
    sign_off:
      required: bool
      checklist: [string]
    agent_session:
      enabled: bool

# --- Post-completion (operate queue injection after Owner review) ---

post_completion:
  new_capabilities: [string]
  new_risks: [string]
  operate_queue_items:
    - id: string
      source_lane_id: string
      operate_lane: enum   # governance | troubleshoot | release | business-advisory
      title: string
      description: string
      handoff_kind: enum   # one_off | recurring_setup
      reason: string
      agent_task_id: string # optional; validated against config/agent-tasks.yaml
      acceptance_criteria: [string]
      verification_steps: [string]
      risk_level: enum     # low | medium | high
      owner: string
      due_at: string       # RFC3339

# --- Metadata ---

metadata:
  created_at: string
  owner: string
  lane_id: string   # Briefing lane id (lanes.yaml) — Delivery Board Scope→Lane filter
  operate_lane: enum # optional default only; each Program/item still requires Owner assessment
  prerequisite_programs: [string]
  tags: [string]
