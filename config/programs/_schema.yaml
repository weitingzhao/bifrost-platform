# Program Blueprint Schema
# ============================================================
# Each YAML file in this directory defines a Program Blueprint —
# declarative phases for Delivery Board sign-off and optional
# Cursor SDK execution via api/internal/devagent.
# ============================================================

# --- Top-level fields ---

id: string
title: string
description: string
status: enum            # active | completed | archived

# --- Delivery Board (Wave 2) ---

delivery:
  board_visible: bool   # true → listed on Mission Control → Delivery Board
  former_location: string
  sign_off_mechanism: enum   # api only (D12 — dev_agent/vision_gate removed Wave 3)

# --- Execution context (optional for delivery-only programs) ---

workspace: string
skill_path: string
model: string           # defaults to composer-2.5

# --- Phases ---

phases:
  - id: string
    title: string
    status: enum        # pending | done | skipped
    prompt_template: string
    verify_cmd: string
    acceptance: [string]
    depends_on: [string]
    sign_off:
      required: bool
      checklist: [string]
    agent_session:
      enabled: bool

# --- Post-completion (operate queue injection after Owner review) ---

post_completion:
  new_capabilities: [string]
  new_risks: [string]
  operate_queue_items:
    - id: string
      source_lane_id: string
      operate_lane: enum   # governance | troubleshoot | release | business-advisory
      title: string
      description: string
      handoff_kind: enum   # one_off | recurring_setup
      reason: string
      agent_task_id: string # optional; validated against config/agent-tasks.yaml
      acceptance_criteria: [string]
      verification_steps: [string]
      risk_level: enum     # low | medium | high
      owner: string
      due_at: string       # RFC3339

# --- Metadata ---

metadata:
  created_at: string
  owner: string
  lane_id: string   # Briefing lane id (lanes.yaml) — Delivery Board Scope→Lane filter
  operate_lane: enum # optional default only; each Program/item still requires Owner assessment
  prerequisite_programs: [string]
  tags: [string]
