id: delivery-lifecycle-close
title: "Delivery lifecycle close — Session / Board / Operate"
description: >
  Close the Delivery product holes found in the 2026-08-08 QA.
  Locked Owner decisions: (D1) Board Complete == catalog close, not gates-only;
  honor requires_post_completion. (D2) At most one live (not session-released)
  program per lane_id; template clones must 409 on a second open bind.
  (D3) Once handoff is approved / in_operate, the lane leaves Active Session;
  Operate wait lives on Agent Desk. Delivery Board stays a read-only catalog.
status: completed
delivery:
  board_visible: true
  former_location: Mission Control → Active Session / Delivery Board
  sign_off_mechanism: api

workspace: /Users/vision-mac-trader/Desktop/stocks
model: composer-2.5

post_completion:
  new_capabilities:
    - "Single close predicate shared by Active Session, Briefing lifecycle, TCC, Delivery Board"
    - "API rejects a second live program bind on the same lane"
    - "Operate handoff no longer occupies Active Session Doing"
  new_risks:
    - "Programs without post_completion auto-graduate after last gate — blueprints that need a close ritual must declare post_completion"
    - "Legacy multi-open lanes (if any appear) still AND-release until unbound"
  operate_queue_items: []

phases:
  # ── Wave 0 — Contract ──────────────────────────────────────────
  - id: P0
    title: "W0 — Shared close predicate (catalogComplete + sessionReleased)"
    status: done
    prompt_template: |
      Execute {{phase_title}} for program {{id}}.

      Scope: bifrost-platform only. Do not start Board/TCC/API bind work (later phases).

      Locked contract (do not renegotiate):

      gatesComplete = existing API `complete` (gates signed, else all phases done).

      catalogComplete (Delivery Board Complete band):
        - if requires_post_completion: assessment ∈ {no_handoff, closed}
        - else: gatesComplete

      sessionReleased (lane may leave Active Session Doing):
        - if requires_post_completion:
            assessment ∈ {no_handoff, closed, approved, in_operate}
        - else: gatesComplete

      pending_review or empty assessment + requires_post_completion → NOT released.

      Implement:
      1. Export TS helpers next to isProgramDeliveryClosed in
         console/src/lib/briefing/briefingStatus.ts
         (rename/split: isProgramCatalogComplete, isProgramSessionReleased;
         keep isProgramDeliveryClosed as alias of catalogComplete OR delete after call-site update in THIS phase only if tests stay green).
      2. Expand briefingStatus.test.ts for: no post_completion + gates done;
         req_pc + no assessment; req_pc + no_handoff; req_pc + in_operate
         (catalog false, session true); multi-program lane AND for both maps.
      3. Mirror the same predicate comments in api/internal/devagent (test-only
         helper OK) so Go and TS cannot drift. Add Go tests.

      Do NOT change Delivery Board UI or template 409 in this phase.

      Output a Phase completion report.
    verify_cmd: "cd /Users/vision-mac-trader/Desktop/stocks/bifrost-platform/console && npx vitest run src/lib/briefing/__tests__/briefingStatus.test.ts && cd ../api && go test ./internal/devagent/ -count=1"
    acceptance:
      - "TS helpers encode catalogComplete vs sessionReleased exactly as locked"
      - "Vitest covers req_pc false auto-close and in_operate session-release"
      - "Go tests document the same assessment sets"
    depends_on: []
    sign_off:
      required: true
      checklist:
        - "Owner confirms pending_review stays in Active Session"
        - "Owner confirms programs without post_completion auto-graduate after last gate"

  # ── Wave 1 — Surfaces consume the predicate ────────────────────
  - id: P1
    title: "W1 — Active Session + Briefing lifecycle use sessionReleased"
    status: done
    prompt_template: |
      Execute {{phase_title}} for program {{id}}.

      Depends on P0 helpers.

      Wire sessionReleased (not catalogComplete) into:
      - useDeliveryProgramClosure / buildLaneProgramsClosedMap (rename maps if clearer)
      - laneLifecycleFromQueue programsClosed option (keep param name or rename to programsReleased — update all callers)
      - ActiveSessionPage doing filter + signoffPending banner (list only not-released programs)
      - BriefingPage / TrackLaneSection / BriefingViewTabsSection / BriefingWorkDigestPanel

      Loading rule: programsClosed === undefined must NOT classify all-done queues as Archive
      (avoid flash). Treat unknown as not-yet-released OR keep previous; add a test.

      Output a Phase completion report.
    verify_cmd: "cd /Users/vision-mac-trader/Desktop/stocks/bifrost-platform/console && npm run type-check && npx vitest run src/lib/briefing/__tests__/briefingStatus.test.ts src/lib/task-mode/__tests__/sessionLaneFocus.test.ts"
    acceptance:
      - "Doing = queue active OR (queue done AND any linked program not sessionReleased)"
      - "in_operate no longer keeps a queue-done lane in Active Session"
      - "Board-loading flicker to Archive is covered by a test"
    depends_on: ["P0"]
    sign_off:
      required: true
      checklist:
        - "Owner: queue-done + in_operate lane is Archive, not Doing"

  - id: P2
    title: "W1 — Delivery Board Complete = catalogComplete"
    status: done
    prompt_template: |
      Execute {{phase_title}} for program {{id}}.

      Delivery Board is read-only catalog. Change Complete band to catalogComplete
      (P0), not API `complete` / gates-only.

      Files: programsTypes mapProgramSummaryToOverview, DeliveryBoardPage bandOf /
      filters, DeliveryBoardCompleteGrid labels, any "complete" DenseTag on Board.

      Copy:
      - Complete = Closed (no_handoff / closed) when requires_post_completion
      - Gates signed but close pending → inProgress (not Complete), tag "Close pending"
      - in_operate → inProgress, tag "In operate" (not Complete, not Active Session)

      allowSignOff stays false.

      Output a Phase completion report.
    verify_cmd: "cd /Users/vision-mac-trader/Desktop/stocks/bifrost-platform/console && npm run type-check && npm run lint"
    acceptance:
      - "Board Complete count matches catalogComplete, not gates-only"
      - "Close-pending and In-operate are visibly not Complete"
      - "No sign-off controls on Delivery Board"
    depends_on: ["P0"]
    sign_off:
      required: true
      checklist:
        - "Owner: Board no longer looks greener than Active Session for the same program"

  - id: P3
    title: "W1 — Close mutation invalidates board + copy fixes"
    status: done
    prompt_template: |
      Execute {{phase_title}} for program {{id}}.

      1. PostCompletionPendingPanel noHandoffMutation (and submit/approve if missing)
         must invalidate PROGRAMS_BOARD_QUERY_KEY so Active Session doing list
         updates immediately.
      2. Close copy: "All phases are signed" → "All required gates are signed".
      3. ActiveSessionPhaseBoard deliveryStatusLabel: if sign_off.required === false
         and progress done → "Done (no gate)", never "Ready for sign-off".
         Hide Sign off button remains.

      Output a Phase completion report.
    verify_cmd: "cd /Users/vision-mac-trader/Desktop/stocks/bifrost-platform/console && npm run type-check && npm run lint"
    acceptance:
      - "Recording no-handoff drops the lane from Doing without waiting 30s refetch"
      - "Non-gate done phases do not invite sign-off"
    depends_on: ["P1"]
    sign_off:
      required: true
      checklist:
        - "Owner: P1/P2-style non-gates no longer look unsigned"

  # ── Wave 2 — One live program per lane ─────────────────────────
  - id: P4
    title: "W2 — API: reject second live program on the same lane"
    status: done
    prompt_template: |
      Execute {{phase_title}} for program {{id}}.

      When creating a program or template instance with metadata.lane_id = L:
      if another program already bound to L is NOT sessionReleased → HTTP 409
      with a clear error naming the blocking program id.

      PATCH / lane rebind: same rule.

      Historical closed/no_handoff/in_operate siblings do not block.

      Implement in api/internal/devagent (program_templates.go + any create/update
      handler). Tests in program_templates_test.go / new file.

      Do not rewrite existing YAML lane_ids in this phase.

      Output a Phase completion report.
    verify_cmd: "cd /Users/vision-mac-trader/Desktop/stocks/bifrost-platform/api && go test ./internal/devagent/ -count=1"
    acceptance:
      - "Second open bind on same lane_id returns 409"
      - "Bind succeeds when existing siblings are sessionReleased"
    depends_on: ["P0"]
    sign_off:
      required: true
      checklist:
        - "Owner: template Build clone cannot pin a second live program on a Doing lane"

  - id: P5
    title: "W2 — Console: bind UX + TCC/Session pick the live program"
    status: done
    prompt_template: |
      Execute {{phase_title}} for program {{id}}.

      1. Create-program / template instance UI surfaces the 409 message (no silent fail).
      2. pickBoardProgramForLane / resolveDevProgramId: prefer the single not-sessionReleased
         program; if multiple open (legacy), prefer incomplete then id — and Active Session
         banner already lists all open ids (keep).
      3. Do not bind TCC to a sessionReleased program when an open sibling exists.

      Tests: console/src/lib/task-mode/__tests__/devProgramResolve.test.ts

      Output a Phase completion report.
    verify_cmd: "cd /Users/vision-mac-trader/Desktop/stocks/bifrost-platform/console && npm run type-check && npx vitest run src/lib/task-mode/__tests__/devProgramResolve.test.ts src/lib/task-mode/__tests__/buildWorkbenchVerdict.test.ts"
    acceptance:
      - "TCC binds the live program on a multi-historical lane"
      - "409 from P4 is visible to Owner in Console"
    depends_on: ["P4", "P1"]
    sign_off:
      required: true
      checklist:
        - "Owner: creating a Build instance on a lane that already has an open program fails clearly"

  - id: P6
    title: "W2 — Inventory: no YAML lane rewrite required (document only)"
    status: done
    prompt_template: |
      Execute {{phase_title}} for program {{id}}.

      Audit live GET /api/v1/programs?board=1 grouped by lane_id.
      If every multi-bind lane is fully sessionReleased (expected after 2026-08-08 stamp):
      write a short note in the Phase report — do NOT rewrite historical
      control-room-ui--build / --rocket-build lane_ids.

      If any lane has two+ not-released programs: list them and STOP for Owner
      (unbind vs merge). Do not guess.

      Output a Phase completion report with the lane table.
    verify_cmd: "curl -sf http://127.0.0.1:8780/api/v1/programs?board=1 >/dev/null"
    acceptance:
      - "Phase report lists every lane with >1 program and whether any is still live"
      - "No speculative YAML lane_id edits"
    depends_on: ["P4"]
    sign_off:
      required: true
      checklist:
        - "Owner reviewed the multi-bind inventory; no surprise live doubles"

  # ── Wave 3 — TCC + graduation copy ─────────────────────────────
  - id: P7
    title: "W3 — TCC verdict uses sessionReleased; archive CTA → Briefing"
    status: done
    prompt_template: |
      Execute {{phase_title}} for program {{id}}.

      resolveBuildWorkbenchVerdict / resolveSessionLaneFocus must take programsClosed
      from the P0/P1 map (sessionReleased), not signed < phase_count.

      Archive / complete kind CTA: navigate to Briefing (Archive), NOT Delivery Board.
      Optional secondary text may say catalog is on Delivery Board — primary CTA is Briefing.

      Update buildWorkbenchVerdict.test.ts + sessionLaneFocus.test.ts.

      Output a Phase completion report.
    verify_cmd: "cd /Users/vision-mac-trader/Desktop/stocks/bifrost-platform/console && npx vitest run src/lib/task-mode/__tests__/buildWorkbenchVerdict.test.ts src/lib/task-mode/__tests__/sessionLaneFocus.test.ts && npm run type-check"
    acceptance:
      - "6/6 gates + 8 phases + no_handoff → TCC archive, not sign-off"
      - "8/8 unsigned close (req_pc) → TCC Active Session sign-off, not Board"
      - "Archive CTA opens Briefing"
    depends_on: ["P1", "P5"]
    sign_off:
      required: true
      checklist:
        - "Owner: TCC next-line matches Active Session for the MD-expand shape"

  - id: P8
    title: "W3 — Global QA + E2E checklist"
    status: done
    prompt_template: |
      Execute {{phase_title}} for program {{id}}.

      Run:
      - console: npm run type-check && npm run lint && npx vitest run
        src/lib/briefing/__tests__/briefingStatus.test.ts
        src/lib/task-mode/__tests__/sessionLaneFocus.test.ts
        src/lib/task-mode/__tests__/buildWorkbenchVerdict.test.ts
        src/lib/task-mode/__tests__/devProgramResolve.test.ts
      - api: go test ./internal/devagent/ ./internal/operatequeue/ -count=1
      - Restart platform-api if binary is stale (bdev restart platform-api; no run_platform.py)

      Manual E2E checklist in the Phase report (Owner will click):
      1. Briefing has no Delivery sign-off section
      2. Board Complete == closed programs only
      3. Fake/mental: gates done + req_pc + no assessment → Doing + Board inProgress
      4. No-handoff → leaves Doing immediately; Board Complete
      5. Second live program on same lane → 409
      6. TCC archive → Briefing

      D10: do not touch trade execution.

      Output a Phase completion report + Batch-style QA summary.
    verify_cmd: "cd /Users/vision-mac-trader/Desktop/stocks/bifrost-platform/console && npm run type-check && npm run lint && cd ../api && go test ./internal/devagent/ ./internal/operatequeue/ -count=1"
    acceptance:
      - "Automated matrix green"
      - "E2E checklist written for Owner click-through"
    depends_on: ["P2", "P3", "P5", "P6", "P7"]
    sign_off:
      required: true
      checklist:
        - "Owner walked the E2E checklist (or explicitly waived click-through)"
        - "No D10 / live-trading path touched"

metadata:
  created_at: "2026-08-08"
  owner: vision-mac-trader
  lane_id: console-api
  tags: [delivery-board, briefing, active-session, ops]
  prerequisite_programs: []
  qa_source: delivery-flow-qa.canvas.tsx
