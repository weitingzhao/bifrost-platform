id: retrospective-agent
title: Retrospective Agent — Defect Report & Fix-PR
description: >
  Drift · Maintain — close retrospective-agent spine stream (code-level DefectReport
  + autonomous fix-PR proposal). Pattern clustering, root-cause classification,
  and Ops Console Defects dashboard already shipped. Hermes LLM key
  (hermes-gateway-integration) is Owner-gated and does not block this program.
status: completed
delivery:
  board_visible: true
  former_location: Engineer → Drift detection & remediation · Observe → Diagnosis → Defects
  sign_off_mechanism: api
phases:
  - id: B0
    title: DefectReport acceptance (spec)
    status: done
    depends_on: []
    verify_cmd: "test -f config/programs/completed/retrospective-agent.yaml && grep -q 'DefectReport' config/programs/completed/retrospective-agent.yaml"
    acceptance:
      - "DefectReport fields: id, title, pattern_ids, root_cause, confidence, severity, attributions (file, line_range, commit_sha, evidence, confidence)"
      - "Only platform_defect (and high-confidence probe_drift) patterns emit reports"
      - "Heuristic + path-from-text attribution; commit_sha optional when unknown"
    sign_off:
      required: true
      checklist:
        - Spec accepted in program YAML
  - id: B1
    title: Go analyzer DefectReport aggregation
    status: done
    depends_on: [B0]
    verify_cmd: "cd api && go test ./internal/retrospective/ -count=1"
    acceptance:
      - "Analyzer aggregates PatternCluster into DefectReport list with code attributions"
      - "Scope/error heuristics map to known bifrost-platform paths"
      - "Unit tests cover empty store + platform_defect attribution"
    sign_off:
      required: true
      checklist:
        - go test ./internal/retrospective/ passes
  - id: B2
    title: GET retrospective defects endpoint
    status: done
    depends_on: [B1]
    verify_cmd: "curl -sf http://127.0.0.1:8780/api/v1/agent/retrospective/defects | jq -e '.defects != null and .generated_at'"
    acceptance:
      - "Endpoint returns generated_at, total, and defects array"
      - "Also available on full report as defects array (same aggregation)"
      - "Route registered in server_test getRoutes"
    sign_off:
      required: true
      checklist:
        - Live curl defects endpoint OK
  - id: B3
    title: Console Defects code-attribution panel
    status: done
    depends_on: [B2]
    verify_cmd: "test -f console/src/pages/DefectsPage.tsx && grep -q 'CodeAttributionPanel' console/src/pages/DefectsPage.tsx"
    acceptance:
      - "Defects page shows Code Attribution panel (file, line_range, confidence, pattern link)"
      - "fetchRetrospectiveDefects wired via TanStack Query"
      - "Dense UI primitives only — no new page-local table CSS"
    sign_off:
      required: true
      checklist:
        - Attribution panel visible on Defects page
  - id: C0
    title: defect-pattern fix-PR proposal path (dry-run safe)
    status: done
    depends_on: [B3]
    verify_cmd: "grep -q 'Fix-PR proposal' agent/remediation/src/scopedPrompts.ts && grep -q 'request_operator_approval' agent/remediation/src/scopedPrompts.ts"
    acceptance:
      - "defect-pattern-remediate runner prompt includes Fix-PR proposal workflow for platform_defect"
      - "Dry-run default — draft PR title/body + files from DefectReport; no push without approval"
      - "Console Fix prompt includes GET defects attribution hint"
    sign_off:
      required: true
      checklist:
        - Prompt path documented and greppable
  - id: C1
    title: Owner approval gate (reuse Agent Desk)
    status: done
    depends_on: [C0]
    verify_cmd: "grep -q 'request_operator_approval' agent/remediation/src/scopedPrompts.ts"
    acceptance:
      - "Fix-PR path requires request_operator_approval before git_commit / gh pr create"
      - "Skip/cancel options preserved (existing Agent Desk approval UX)"
      - "No new external deps or RPC ops"
    sign_off:
      required: true
      checklist:
        - Approval gate language present in scoped prompt
  - id: C2
    title: Post-fix re-probe (mission-auto-remediation)
    status: done
    depends_on: [C1]
    verify_cmd: "grep -q 'runPostFixVerification' agent/remediation/src/runner.ts"
    acceptance:
      - "Runner always re-probes verify_mission_snapshot / post_fix_verification before job close"
      - "Spine mission-auto-remediation item 5 marked done; Trade-on-K3s residual documented"
    sign_off:
      required: true
      checklist:
        - Post-fix evidence in runner
  - id: C3
    title: Close retrospective-agent stream (honest close)
    status: done
    depends_on: [C2]
    verify_cmd: "grep -A6 'id: retrospective-agent' config/ops-context.yaml | grep -q 'status: closed'"
    acceptance:
      - "Spine retrospective-agent done=5/5 status=closed with honest note"
      - "Program status completed after gates signed"
      - "Do not fake-close Hermes or Trade-on-K3s residual"
    sign_off:
      required: true
      checklist:
        - Stream closed with evidence
        - Residual Ready items documented (Hermes key, Trade-on-K3s)
metadata:
  created_at: "2026-08-05"
  completed_at: "2026-08-05"
  owner: vision-mac-trader
  lane_id: drift-remediation
  tags: [delivery-board, engineer, drift-remediation, retrospective, defects]
