id: stock-readiness-retire
title: Stock Readiness Daily — Retire Trade Legacy Table
description: |
  Evaluate and retire `public.stock_readiness_daily` on Trade DB (bifrost_dev/stg/prod).

  **P1 verdict (2026-08-23):** In the current default stack (`SEPA_USE_ANALYTICS=true`,
  Research proxy, Plugin readiness HTTP), the table has **no production business role**.
  It is superseded by Golden Source dbt marts (`dw_stock.mart_sepa_*` / `analytics.sepa_*`)
  and Plugin `/market/readiness/*`. Trade DB copies were DROPped 2026-08-20/21 per
  MIGRATION_TRACKING §15; bifrost-core DDL still CREATE (deprecated) — technical debt.

  **Residual risk:** ~2000 lines legacy SQL in `data_readiness.py` / `readiness_snapshot.py`
  if `SEPA_USE_ANALYTICS=false`; `db-init` can recreate empty table.

  **Not a table problem:** `symbols-snapshot` / tier marts empty until ≥252 trading days of
  `market.stock_daily` — same gap on analytics path; fundamentals already live (STG ~3555).

  **Owner decision: RETIRE (2026-08-23)** — P1 signed off; proceed with Waves W1–W5.

  D10 BLOCKED. Do not unsuspend `market-data-readiness-refresh` CronJob.
