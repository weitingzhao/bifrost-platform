id: research-loop-automation
title: Research Loop Automation — Analyze consolidation + Copilot linkage
description: |
    Research / Product — close the research loop and sharpen what feeds it.
    Wave A: one lens registry + Exhibit for every lens + Signal Decay lens expansion.
    Wave B: LLM plan repair, two-model (DeepSeek + OpenAI) Persona judgement with
    per-provider caps, outcome-rule hypothesis resolution, every objective on the Cron.
    Wave C: Analyze 12 pages → 5 hubs with redirects; per-lens analytical depth; Daily
    Brief on exhibits. Wave D: Copilot reads runs, one daily digest, unattended
    auto-accept under Trust L0 with quality gates, Copilot verdicts back on pages.
    D10 BLOCKED — research drafts and advisory verdicts only; order intents never
    auto-accepted. P0 hygiene (DDL apply / image alignment) out of scope by Owner.
status: active
workspace: /Users/vision-mac-trader/Desktop/stocks
skill_path: .cursor/skills/research-loop-automation/SKILL.md
