# Registered Bifrost Trade environments for connectivity matrix (Phase 0).
# Override nginx_base via env-specific .env on the platform host if needed.

environments:
  - id: dev
    label: Development
    probe_mode: pull
    nginx_base: http://192.168.10.73:30882
    ingress_host: dev.trader.bifrost.lan
    ingress_node_ip: 192.168.10.73
    # Matrix probe: primary signal from cluster/postgres API; LAN NodePort fallback when cluster API unavailable.
    postgres:
      host: 192.168.10.73
      port: 30432
    # Matrix probe: primary signal from cluster/redis API; dev LAN NodePort fallback.
    redis:
      host: 192.168.10.73
      port: 30379
    ops_token_env: BIFROST_DEV_OPS_TOKEN

  - id: dev-local
    label: Mac (thin client)
    probe_mode: bridge
    # satellite-probe-bridge on developer Mac probes K3s dev ingress (Vision V1).
    trade_bridge_url: http://127.0.0.1:8786
    nginx_base: http://192.168.10.73:30882
    postgres:
      host: 192.168.10.73
      port: 30432
    redis:
      host: 192.168.10.73
      port: 30379

  - id: stg
    label: Staging
    probe_mode: pull
    nginx_base: http://192.168.10.73:30880
    ingress_host: stg.trader.bifrost.lan
    ingress_node_ip: 192.168.10.73
    postgres:
      host: 192.168.10.73
      port: 30432
    redis:
      host: 192.168.10.73
      port: 30380
    ops_token_env: BIFROST_STG_OPS_TOKEN

  - id: prod
    label: Production
    probe_mode: pull
    # Traefik trade-prod NodePort escape (in-cluster + LAN; VIP :80 redirects to https://*.lan).
    nginx_base: http://192.168.10.73:30881
    ingress_host: trader.bifrost.lan
    ingress_node_ip: 192.168.10.73
    # CNPG @ data NS — matrix uses cluster API; LAN NodePort fallback below.
    postgres:
      host: 192.168.10.73
      port: 30432
    redis:
      host: 192.168.10.73
      port: 30382
    ops_token_env: BIFROST_PROD_OPS_TOKEN
