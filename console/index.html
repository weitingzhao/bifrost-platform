<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111720" />
    <script>
      (() => {
        let appearance = 'system', style = 'gradient';
        try {
          const saved = localStorage.getItem('bifrost-ops-appearance');
          if (saved === 'light' || saved === 'dark') appearance = saved;
          if (localStorage.getItem('bifrost-ops-visual-style') === 'grayscale') style = 'grayscale';
        } catch {}
        const dark = appearance === 'dark' || (appearance === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.opsTheme = dark ? 'dark' : 'light';
        document.documentElement.dataset.opsStyle = style;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bifrost Ops" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bifrost Platform Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
