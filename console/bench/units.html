<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Workshop</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap" />
    <style>
      :root { --bg: #f3efe6; --card: #fffdf8; --ink: #2f2d3a; --mute: #7a7568; --line: #d8d2c4; --chip: #ece7db; --ok: #2f8f4e; --now: #c77a12; --warn: #b8433f; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d2033; --card: #262a40; --ink: #e6e3f2; --mute: #9a97b0; --line: #3c4160; --chip: #353a58; --ok: #6fd28f; --now: #f2b45a; --warn: #ff8a80; } }
      :root[data-theme="dark"] { --bg: #1d2033; --card: #262a40; --ink: #e6e3f2; --mute: #9a97b0; --line: #3c4160; --chip: #353a58; --ok: #6fd28f; --now: #f2b45a; --warn: #ff8a80; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
      .page { max-width: 1400px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      h2 { font-size: 14px; margin: 0 0 10px; }
      header p { color: var(--mute); font-size: 12px; line-height: 1.6; margin: 0 0 6px; max-width: 820px; }
      header p.read { color: var(--ink); }
      .body { display: grid; grid-template-columns: 220px 1fr; gap: 16px; margin-top: 16px; }
      @media (max-width: 760px) { .body { grid-template-columns: 1fr; } }
      nav { display: flex; flex-direction: column; gap: 6px; }
      nav button { text-align: left; font: inherit; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
      nav button.on { border-color: var(--now); box-shadow: inset 3px 0 0 var(--now); }
      nav button:disabled { opacity: .55; cursor: default; }
      nav span { font-size: 12px; font-weight: 600; } nav em { font-style: normal; font-size: 11px; color: var(--mute); } nav i { font-style: normal; font-size: 10px; color: var(--mute); }
      section { min-width: 0; }
      .what { font-weight: 400; font-size: 11px; color: var(--mute); margin-left: 8px; }
      .stages { list-style: none; padding: 0; margin: 0 0 12px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
      @media (max-width: 760px) { .stages { grid-template-columns: repeat(2, 1fr); } }
      .stages button { width: 100%; font: inherit; text-align: left; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
      .stages b { font-size: 12px; } .stages span { font-size: 10px; color: var(--mute); }
      .stages .confirmed span { color: var(--ok); } .stages .open span { color: var(--now); } .stages .waiting { opacity: .6; }
      .stages button.on { border-color: var(--ink); }
      .stage { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      dl { margin: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; font-size: 11.5px; line-height: 1.5; }
      @media (max-width: 760px) { dl { grid-template-columns: 1fr; } }
      dt { color: var(--mute); font-weight: 600; margin-bottom: 2px; } dd { margin: 0; } dd ul { margin: 0; padding-left: 16px; }
      .scroll { overflow-x: auto; }
      table.matrix { border-collapse: collapse; font-size: 11px; min-width: 100%; }
      .matrix th, .matrix td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
      .matrix thead th { color: var(--mute); font-weight: 600; position: sticky; top: 0; background: var(--card); }
      .matrix tbody th { white-space: normal; min-width: 220px; max-width: 280px; font-weight: 400; cursor: help; }
      .matrix tbody th b { display: block; font-size: 11.5px; } .matrix tbody th span { color: var(--mute); font-size: 10.5px; }
      .matrix td { font-variant-numeric: tabular-nums; } .matrix td[title] { cursor: help; }
      .matrix td.none { color: var(--mute); font-style: italic; } .matrix td.per { color: var(--mute); }
      .matrix td .n { color: var(--mute); }
      .matrix tr.chosen th b::after { content: ' ✓'; color: var(--ok); }
      .matrix.draft td { white-space: normal; } .matrix.draft td.wrap { max-width: 520px; color: var(--ink); }
.room { display: flex; flex-direction: column; gap: 10px; }
      .pick { display: flex; flex-wrap: wrap; gap: 6px; }
      .pick button { font: inherit; font-size: 11px; background: var(--chip); color: var(--ink); border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
      .pick button.on { border-color: var(--now); }
      .roomgrid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
      @media (max-width: 760px) { .roomgrid { grid-template-columns: 1fr; } }
      .roomgrid img { width: 100%; height: auto; background: #f6f2ea; border-radius: 8px; }
      .key { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 11.5px; }
      .key b { display: block; } .key span { color: var(--mute); font-size: 11px; }
      .hint { color: var(--mute); font-size: 11px; margin: 0; }
      .warn { color: var(--warn); font-size: 11.5px; margin: 0; }
      .ask { margin: 0; font-size: 12px; background: var(--chip); border-radius: 8px; padding: 10px 12px; border-left: 3px solid var(--now); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./units.tsx"></script>
  </body>
</html>
