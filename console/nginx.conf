server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://platform-api:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://platform-api:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Hashed build output: a name never changes content, so a browser may keep it a year. A name
    # that is not here is a 404, never index.html: a page from before a release asking for a
    # stylesheet the release removed must not get HTML back, or it renders unstyled (TD-385).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page itself, and every SPA route that falls back to it: revalidated on each load, so a
    # browser picks up a release at once instead of keeping the old page and its old asset names (TD-385).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
